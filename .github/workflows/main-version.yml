name: Create main minor release

# A main merge advances the minor version and creates the stable release tag.
# The existing stable-publish workflow owns npm publication for that tag.
# Pushes that only touch workflow/docs/README are not releases and do not bump the version.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'website/**'
      - 'README.md'

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Version main minor release
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore(release): bump stable version')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a workflow-triggering release token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN:-}" ]]; then
            echo "RELEASE_TOKEN secret is required so the generated tag can trigger stable-publish.yml." >&2
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up pnpm
        # Version is read from the packageManager field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the merge commit before release work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "main advanced before release preparation: remote=$remote_sha event=$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Verify the current package
        run: |
          pnpm run typecheck
          pnpm run typecheck:test
          pnpm test
          pnpm run build

      - name: Calculate and apply the minor version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # A develop→main merge can leave the committed manifest carrying an
          # `X.Y.Z-dev.N` prerelease; the stable train releases its numeric
          # base, so normalize the dev suffix here BEFORE the strict minor
          # bump. release-version.mjs's bump path stays numeric-only; the
          # --normalize-base mode is a separate unit-tested helper call and
          # fails closed on foreign prerelease/build metadata.
          base_version="$(node scripts/ci/release-version.mjs \
            --normalize-base="$(node -p "require('./package.json').version")")"
          next_version="$(node scripts/ci/release-version.mjs \
            --base-version="$base_version" \
            --bump=minor)"
          npm version "$next_version" --no-git-tag-version
          # Pin the cli and mcp workspace dependency to the new root release
          # version so the packages can be resolved by npm (which rejects
          # workspace:* protocol). Both always track the root version exactly
          # in lockstep (P8-D1).
          node -e '
            const fs = require("node:fs");
            const next = process.argv[1];
            for (const rel of ["./packages/cli/package.json", "./packages/mcp/package.json"]) {
              const pkg = JSON.parse(fs.readFileSync(rel, "utf8"));
              pkg.dependencies["hikoutei"] = next;
              fs.writeFileSync(rel, JSON.stringify(pkg, null, 2) + "\n");
            }
          ' "$next_version"
          # Regenerate lockfiles after all manifest changes (root + child pins)
          # are settled.
          npm install --package-lock-only --no-audit --no-fund --ignore-scripts
          # Dual-lockfile transition (P8-D1): package-lock.json is kept until
          # every consumer of it is flipped; pnpm-lock.yaml is the pnpm
          # source of truth and must move with the version pins so a
          # later `pnpm install --frozen-lockfile` still resolves the exact
          # pins to the workspace package (linkWorkspacePackages: true).
          pnpm install --lockfile-only
          node -e '
            const expected = process.argv[1];
            const pkg = require("./package.json");
            const lock = require("./package-lock.json");
            if (pkg.name !== "hikoutei" || pkg.version !== expected || lock.version !== expected || lock.packages[""].version !== expected) process.exit(1);
          ' "$next_version"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Verify version bump scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'package-lock.json\npackage.json\npackages/cli/package.json\npackages/mcp/package.json\npnpm-lock.yaml'
          if [[ "$changed" != "$expected" ]]; then
            printf 'unexpected version bump files:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Commit and tag the stable release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/cli/package.json packages/mcp/package.json pnpm-lock.yaml
          git commit -m "chore(release): bump stable version to $RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" \
            -m "chore(release): stable $RELEASE_VERSION"

      - name: Push the main release commit and tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "main advanced during release preparation: remote=$remote_sha event=$GITHUB_SHA" >&2
            exit 1
          fi
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"
