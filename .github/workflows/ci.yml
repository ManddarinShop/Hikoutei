name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit, type, build, packed sync/provider E2E, and installed root API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify public Kohkai dependency
        shell: bash
        run: |
          set -euo pipefail
          kohkai_version="$(node -p "require('./package.json').dependencies['@hikoutei/kohkai'] || ''")"
          test -n "$kohkai_version"
          published_kohkai_version="$(npm view "@hikoutei/kohkai@$kohkai_version" version --registry=https://registry.npmjs.org)"
          test "$published_kohkai_version" = "$kohkai_version"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck production code
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Run unit and contract tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Run installed-package internal sync/provider E2E and root API smoke (fake)
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/hikoutei-consumer"
          mkdir -p "$consumer_dir"
          pack_file="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          pack_path="$RUNNER_TEMP/$pack_file"
          # The root package depends on the @hikoutei/ikisaki workspace
          # package; pack it too so the consumer install resolves locally.
          ikisaki_pack_file="$(cd packages/ikisaki && npm pack --silent --pack-destination "$RUNNER_TEMP")"
          ikisaki_pack_path="$RUNNER_TEMP/$ikisaki_pack_file"

          (
            cd "$consumer_dir"
            npm init -y >/dev/null
            npm install --no-audit --no-fund --ignore-scripts \
              "$ikisaki_pack_path" \
              "$pack_path" \
              "@mikro-orm/core@7.1.7" \
              "@mikro-orm/sql@7.1.7"
          )

          # Internal sync/provider E2E: loads dist modules directly and exercises
          # projection registration, provisioning, the worker, and polling.
          cp scripts/ci/run-api-scenario.mjs "$consumer_dir/run-api-scenario.mjs"
          node "$consumer_dir/run-api-scenario.mjs" \
            --backend=fake \
            --output="$RUNNER_TEMP/hikoutei-fake-result.json" \
            --manifest="$RUNNER_TEMP/hikoutei-fake-manifest.json"

          # Installed root API smoke: imports ONLY the installed `hikoutei` root
          # entrypoint and drives the public entity-lifecycle contract.
          cp scripts/ci/run-root-api-scenario.mjs "$consumer_dir/run-root-api-scenario.mjs"
          cp scripts/ci/root-api-options.mjs "$consumer_dir/root-api-options.mjs"
          node "$consumer_dir/run-root-api-scenario.mjs" \
            --output="$RUNNER_TEMP/hikoutei-root-api-smoke-result.json"

      - name: Upload installed-consumer reports (fake)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hikoutei-fake-installed-consumer
          path: |
            ${{ runner.temp }}/hikoutei-fake-result.json
            ${{ runner.temp }}/hikoutei-root-api-smoke-result.json
          if-no-files-found: ignore
