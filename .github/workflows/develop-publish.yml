name: Publish develop package

# Triggered by a develop release tag such as develop-v0.3.1. The tag must
# exactly match the numeric version in package.json and package-lock.json; the
# separate develop-version workflow creates the version commit and tag.
#
# The published package is tagged `latest`, so every develop merge becomes the
# version a plain `npm install hikoutei` resolves. The main/stable channel also
# publishes `latest` with globally-increasing minor versions; keep the two
# channels aligned by merging main back into develop after each main release
# (see docs/ci.md) so the develop patch line never trails the latest tag.
#
# The workflow can also be dispatched manually in two recovery modes:
#
# 1. Tag recovery: dispatch with an existing develop release tag (for example
#    develop-v0.8.65) to recover a publish that failed or was skipped. The
#    verify job checks out that exact tag and builds it in the same run, and
#    publication repairs (instead of failing on) versions that already exist
#    on a registry.
#
# 2. Historical recovery (audited): dispatch with `source_ref` (a full
#    immutable commit SHA, typically a PR head SHA of the original work) plus
#    the exact `version` that commit corresponds to, to rebuild and publish a
#    version whose develop-v tag is missing from the repository (for example
#    the 0.8.5–0.8.64 range has no tags). The verify job checks out that
#    exact commit, bumps package.json/package-lock.json on the runner only
#    with `npm version <version> --no-git-tag-version` (never a git
#    commit/tag/push), builds and packs it, and publishes the tarball as that
#    version under the `historical` dist-tag — never `latest`. There is no
#    automatic manifest mapping: the caller supplies both the PR head SHA and
#    its version for each recovery. Versions must be recovered sequentially
#    in increasing order so the `historical` dist-tag moves monotonically
#    forward, and the example-verification repository_dispatch is skipped in
#    historical mode. A PR head that predates the recovery harness (E2E and
#    consumer scripts, ikisaki workspace, required npm scripts) fails in
#    verify with a compatibility error; it is never claimed as verified.
#
#    An optional `recovery_patch` input applies an audited fix on top of the
#    historical source (for example PR #246 / 0.8.5 needs PR #307's
#    requireStatusCountRow validator because its syncStatus aggregate casts do
#    not typecheck against current tooling). The input names a relative path
#    under .github/recovery/patches/; the verify job fetches that file from
#    the workflow's current develop commit before checking out the historical
#    source, applies it with `git apply` after the SHA assertion and before
#    the runner-only version bump, and records its path and sha256 inside the
#    artifact. The patch is never executed; the publish job verifies the
#    records before any registry mutation. Tag mode never accepts
#    recovery_patch.
#
# Recovery never creates tags or alters the develop branch in any mode.
on:
  push:
    tags:
      - 'develop-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing develop release tag to verify and publish (e.g. develop-v0.8.65); the tag must already exist in the repository. Mutually exclusive with source_ref/version."
        required: false
        type: string
      source_ref:
        description: "Full immutable commit SHA (a PR head SHA of the original work) to rebuild from; must be exactly 40 hex characters. Mutually exclusive with tag; requires version."
        required: false
        type: string
      version:
        description: "Strict numeric semver (X.Y.Z, no leading zeros or prerelease) to rebuild and publish from source_ref. Requires source_ref."
        required: false
        type: string
      recovery_patch:
        description: "Relative path under .github/recovery/patches/ of an audited patch to fetch from the current develop commit and apply (git apply, never executed) to the historical source after its SHA assertion. Valid only with source_ref/version; rejected in tag mode."
        required: false
        type: string

concurrency:
  # Serialize every develop publish so the channel cannot move backward due
  # to two tag workflows finishing out of order.
  group: develop-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify develop package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve publish mode
        id: resolve-mode
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RECOVERY_PATCH: ${{ inputs.recovery_patch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mode="tag"
          tag=""
          version=""
          source_ref=""
          recovery_patch=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            if [[ -n "$INPUT_SOURCE_REF" || -n "$INPUT_VERSION" ]]; then
              echo "tag is mutually exclusive with source_ref/version" >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          elif [[ -n "$INPUT_SOURCE_REF" || -n "$INPUT_VERSION" ]]; then
            if [[ -z "$INPUT_SOURCE_REF" || -z "$INPUT_VERSION" ]]; then
              echo "source_ref and version must be provided together for historical recovery" >&2
              exit 1
            fi
            mode="historical"
            source_ref="$INPUT_SOURCE_REF"
            version="$INPUT_VERSION"
          else
            echo "workflow_dispatch requires either tag or source_ref+version" >&2
            exit 1
          fi

          if [[ "$mode" == "tag" ]]; then
            if [[ "$tag" =~ ^develop-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            else
              echo "Develop release tag must be develop-vX.Y.Z: $tag" >&2
              exit 1
            fi
          else
            # Reject any non-SHA source_ref: a branch name, short SHA, or tag
            # could move during the run and break the audit trail. The caller
            # supplies an immutable PR head SHA.
            if [[ ! "$source_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "source_ref must be a full immutable commit SHA (40 hex chars): $source_ref" >&2
              exit 1
            fi
            source_ref="$(printf '%s' "$source_ref" | tr 'A-F' 'a-f')"
            # Strict numeric semver: no leading zeros, prerelease, or build
            # metadata, matching the release train's stable-version notion.
            if [[ ! "$version" =~ ^([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)$ ]]; then
              echo "version must be strict numeric semver X.Y.Z: $version" >&2
              exit 1
            fi
          fi

          # recovery_patch is an audited patch applied on top of the
          # historical source (see .github/recovery/patches/); it is valid
          # only in historical mode and is rejected in tag/push mode.
          if [[ -n "$INPUT_RECOVERY_PATCH" ]]; then
            if [[ "$mode" != "historical" ]]; then
              echo "recovery_patch is only valid with source_ref+version (historical recovery); rejected in tag mode" >&2
              exit 1
            fi
            # Constrain the patch to a relative path under the recovery
            # patches directory: no absolute paths, no .. traversal, and no
            # backslashes. The verify job fetches exactly this path from the
            # current develop commit; the publish job re-checks the recorded
            # path before any registry mutation.
            if [[ ! "$INPUT_RECOVERY_PATCH" =~ ^\.github/recovery/patches/[A-Za-z0-9._/-]+$ ]] \
              || [[ "$INPUT_RECOVERY_PATCH" == *".."* ]]; then
              echo "recovery_patch must be a relative path under .github/recovery/patches/: $INPUT_RECOVERY_PATCH" >&2
              exit 1
            fi
            recovery_patch="$INPUT_RECOVERY_PATCH"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "recovery_patch=$recovery_patch" >> "$GITHUB_OUTPUT"

      - name: Fetch audited recovery patch from current develop commit
        if: steps.resolve-mode.outputs.mode == 'historical' && steps.resolve-mode.outputs.recovery_patch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_PATCH: ${{ steps.resolve-mode.outputs.recovery_patch }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The patch file comes from the workflow's current develop commit
          # (the immutable github.sha this run executes from), fetched before
          # the historical checkout so an old PR head can never supply or
          # alter the audited patch. The path was constrained by resolve-mode;
          # it is re-asserted here before it is used in the fixed raw URL.
          # The patch is plain text and is never executed: it is only fed to
          # `git apply` after the historical checkout passes its SHA assertion.
          if [[ ! "$RECOVERY_PATCH" =~ ^\.github/recovery/patches/[A-Za-z0-9._/-]+$ || "$RECOVERY_PATCH" == *".."* ]]; then
            echo "recovery_patch failed path validation: $RECOVERY_PATCH" >&2
            exit 1
          fi
          curl -fL --retry 3 --header "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/${{ github.repository }}/$RUN_SHA/$RECOVERY_PATCH" \
            -o "$RUNNER_TEMP/hikoutei-recovery.patch"
          # Require a non-empty file so a silent fetch failure cannot
          # masquerade as a no-op patch; git apply below is the final gate.
          test -s "$RUNNER_TEMP/hikoutei-recovery.patch"
          echo "Fetched recovery patch $RECOVERY_PATCH from $RUN_SHA ($(wc -l < "$RUNNER_TEMP/hikoutei-recovery.patch") lines)."

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Push runs check out the immutable pushed commit (github.sha) so a
          # moved tag cannot redirect the build. Manual recovery checks out
          # either the explicitly supplied existing develop tag or, in
          # historical mode, the caller-supplied full immutable commit SHA.
          # The token is never persisted into the checkout: historical source
          # must not be able to read a GitHub credential.
          ref: ${{ github.event_name == 'push' && github.sha || (steps.resolve-mode.outputs.mode == 'historical' && steps.resolve-mode.outputs.source_ref || format('refs/tags/{0}', steps.resolve-mode.outputs.tag)) }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Rebuild requested version from source commit (historical recovery)
        if: steps.resolve-mode.outputs.mode == 'historical'
        shell: bash
        env:
          SOURCE_REF: ${{ steps.resolve-mode.outputs.source_ref }}
          REQUESTED_VERSION: ${{ steps.resolve-mode.outputs.version }}
          RECOVERY_PATCH: ${{ steps.resolve-mode.outputs.recovery_patch }}
        run: |
          set -euo pipefail
          # The caller supplied an immutable PR head SHA; refuse to proceed
          # unless the checkout actually resolved to it so the audit trail
          # (recorded SHA -> built code) cannot be redirected.
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$SOURCE_REF" ]]; then
            echo "checked out $actual_sha but source_ref is $SOURCE_REF" >&2
            exit 1
          fi
          # Audited recovery patch: applied only after the SHA assertion, so
          # the code being patched is exactly the requested source. The patch
          # was fetched earlier from the current develop commit and is never
          # executed; a patch that does not apply fails the run clearly.
          if [[ -n "$RECOVERY_PATCH" ]]; then
            test -f "$RUNNER_TEMP/hikoutei-recovery.patch"
            if ! git apply --check "$RUNNER_TEMP/hikoutei-recovery.patch"; then
              echo "recovery patch $RECOVERY_PATCH does not apply to source_ref $SOURCE_REF; refusing to build" >&2
              exit 1
            fi
            git apply "$RUNNER_TEMP/hikoutei-recovery.patch"
            # Audit records for the publish job: the exact patch path and its
            # sha256, carried inside the packed artifact.
            printf '%s' "$RECOVERY_PATCH" > "$RUNNER_TEMP/hikoutei-recovery-patch-path.txt"
            (cd "$RUNNER_TEMP" && sha256sum hikoutei-recovery.patch > hikoutei-recovery-patch.sha256)
            echo "Applied recovery patch $RECOVERY_PATCH to $actual_sha."
          fi
          # Runner-only version bump: --no-git-tag-version updates
          # package.json and package-lock.json in the working tree without
          # creating a commit or tag, so historical recovery never invents
          # Git history or a release tag and never pushes anything.
          npm version "$REQUESTED_VERSION" --no-git-tag-version

      - name: Preflight historical source compatibility
        # Old PR heads may predate the current recovery pipeline (E2E and
        # consumer harness scripts, ikisaki workspace manifest, required npm
        # scripts). Fail clearly up front instead of claiming a SHA was
        # verified when this pipeline cannot run it.
        if: steps.resolve-mode.outputs.mode == 'historical'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for f in \
            package.json \
            package-lock.json \
            scripts/ci/source-ts-loader.mjs \
            scripts/ci/run-api-scenario.mjs \
            scripts/ci/assert-packed-tarball.mjs \
            scripts/ci/run-consumer-typecheck.mjs \
            scripts/ci/run-root-api-scenario.mjs \
            scripts/ci/run-public-api-surface.mjs \
            scripts/ci/root-api-options.mjs \
            packages/ikisaki/package.json; do
            if [[ ! -f "$f" ]]; then
              missing+=("$f")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "source_ref predates the recovery pipeline; this SHA cannot be verified. Missing files:" >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const s of ["typecheck", "typecheck:test", "test", "build"]) {
              if (typeof (pkg.scripts || {})[s] !== "string") {
                console.error("package.json is missing required npm script: " + s);
                process.exit(1);
              }
            }
            const ikisaki = JSON.parse(fs.readFileSync("packages/ikisaki/package.json", "utf8"));
            if (typeof (ikisaki.scripts || {}).build !== "string") {
              console.error("packages/ikisaki/package.json is missing the required build script");
              process.exit(1);
            }
          '
          echo "Historical source provides all recovery pipeline files and scripts."

      - name: Validate release tag matches package versions
        shell: bash
        env:
          MODE: ${{ steps.resolve-mode.outputs.mode }}
          TAG_NAME: ${{ steps.resolve-mode.outputs.tag }}
          EXPECTED_VERSION: ${{ steps.resolve-mode.outputs.version }}
        run: |
          set -euo pipefail
          expected_version="$EXPECTED_VERSION"
          if [[ "$MODE" == "tag" ]]; then
            if [[ "$TAG_NAME" =~ ^develop-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              tag_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            else
              echo "Develop release tag must be develop-vX.Y.Z: $TAG_NAME" >&2
              exit 1
            fi
            if [[ "$tag_version" != "$expected_version" ]]; then
              echo "tag $TAG_NAME resolves to $tag_version but expected $expected_version" >&2
              exit 1
            fi
          fi
          # Historical mode has no tag; this block verifies the runner-only
          # npm version bump produced exactly the requested version.

          pkg_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          echo "mode=$MODE expected_version=$expected_version package.json=$pkg_version package-lock.json=$lock_version"

          if [[ "$pkg_version" != "$expected_version" ]]; then
            echo "package.json version ($pkg_version) does not match expected version ($expected_version)" >&2
            exit 1
          fi
          if [[ "$lock_version" != "$expected_version" ]]; then
            echo "package-lock.json top-level version ($lock_version) does not match expected version ($expected_version)" >&2
            exit 1
          fi
          if [[ "$lock_root_version" != "$expected_version" ]]; then
            echo "package-lock.json root packages version ($lock_root_version) does not match expected version ($expected_version)" >&2
            exit 1
          fi
          test "$(node -p "require('./package.json').name")" = "hikoutei"

      - name: Verify public Kohkai dependency
        shell: bash
        run: |
          set -euo pipefail
          kohkai_version="$(node -p "require('./package.json').dependencies['@hikoutei/kohkai'] || ''")"
          test -n "$kohkai_version"
          published_kohkai_version="$(npm view "@hikoutei/kohkai@$kohkai_version" version --registry=https://registry.npmjs.org)"
          test "$published_kohkai_version" = "$kohkai_version"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck production code
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Run unit and contract tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package name and contents
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "hikoutei"
          npm pack --dry-run

      - name: Pack develop package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.resolve-mode.outputs.version }}
        run: |
          set -euo pipefail
          # Keep the tarball and its checksum together in a dedicated directory so
          # the artifact and publish job reason about a single, self-contained path.
          package_dir="$RUNNER_TEMP/hikoutei-develop-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          package_file="$(npm pack --silent --pack-destination "$package_dir")"
          package_path="$package_dir/$package_file"
          test -f "$package_path"
          tar -xOf "$package_path" package/package.json > "$RUNNER_TEMP/hikoutei-develop-package.json"
          node -e '
            const pkg = require(process.argv[1]);
            const expected = process.argv[2];
            const isStable = /^\d+\.\d+\.\d+$/.test(pkg.version);
            if (pkg.name !== "hikoutei" || !isStable || pkg.version !== expected) process.exit(1);
          ' "$RUNNER_TEMP/hikoutei-develop-package.json" "$EXPECTED_VERSION"
          (cd "$package_dir" && sha256sum "$package_file" > hikoutei-develop-package.sha256)
          # Record the exact commit the release tag (or, in historical mode,
          # the caller-supplied source SHA) points at, plus the requested
          # version. The publish job refuses to publish unless its checkout
          # resolves to the same commit and version, so a moved annotated tag
          # or a mistyped recovery input cannot redirect a verified artifact
          # to different code or a different version.
          git rev-parse HEAD > "$package_dir/hikoutei-develop-tag-commit.sha"
          printf '%s' "$EXPECTED_VERSION" > "$package_dir/hikoutei-develop-requested-version.txt"
          # Carry the audited recovery patch records (path + sha256) inside
          # the artifact when a patch was applied, so the publish job can
          # verify them before any registry mutation.
          if [[ -f "$RUNNER_TEMP/hikoutei-recovery-patch-path.txt" ]]; then
            cp "$RUNNER_TEMP/hikoutei-recovery-patch-path.txt" "$package_dir/hikoutei-recovery-patch-path.txt"
            cp "$RUNNER_TEMP/hikoutei-recovery-patch.sha256" "$package_dir/hikoutei-recovery-patch.sha256"
          fi
          # Build and pack the @hikoutei/ikisaki workspace package from the
          # same verified source so the publish job never builds or runs
          # source-controlled code — it only publishes this pre-built
          # tarball. Kept in a subdirectory so the top-level hikoutei-*.tgz
          # lookup in publish still finds exactly one tarball.
          ikisaki_dir="$package_dir/ikisaki"
          mkdir -p "$ikisaki_dir"
          (cd packages/ikisaki && npm run build && npm pack --silent --pack-destination "$ikisaki_dir")
          # Exact ikisaki artifact integrity: exactly one tarball whose
          # package name/version match the workspace manifest and the version
          # record the publish job reads. The checksum accompanies the tarball
          # so publish can prove it publishes the verified bytes.
          mapfile -t ikisaki_tarballs < <(find "$ikisaki_dir" -maxdepth 1 -name '*.tgz' -type f -print)
          if [[ "${#ikisaki_tarballs[@]}" -ne 1 ]]; then
            echo "expected exactly one ikisaki tarball, found ${#ikisaki_tarballs[@]}" >&2
            exit 1
          fi
          ikisaki_tarball="${ikisaki_tarballs[0]}"
          ikisaki_version="$(node -p "require('./packages/ikisaki/package.json').version")"
          tar -xOf "$ikisaki_tarball" package/package.json > "$RUNNER_TEMP/hikoutei-ikisaki-package.json"
          node -e '
            const pkg = require(process.argv[1]);
            const expected = process.argv[2];
            if (pkg.name !== "@hikoutei/ikisaki" || pkg.version !== expected) process.exit(1);
          ' "$RUNNER_TEMP/hikoutei-ikisaki-package.json" "$ikisaki_version"
          printf '%s' "$ikisaki_version" > "$ikisaki_dir/version.txt"
          (cd "$ikisaki_dir" && sha256sum "$(basename "$ikisaki_tarball")" > hikoutei-ikisaki.sha256)
          echo "Packed $package_path"

      - name: Run repository internal sync/provider E2E (fake)
        shell: bash
        run: |
          set -euo pipefail
          # Internal sync/provider E2E: loads repository source modules through
          # the checked-in TypeScript loader; it is not a package compatibility
          # test.
          node --loader ./scripts/ci/source-ts-loader.mjs scripts/ci/run-api-scenario.mjs \
            --backend=fake \
            --output="$RUNNER_TEMP/hikoutei-develop-fake-result.json" \
            --manifest="$RUNNER_TEMP/hikoutei-develop-manifest.json"

      - name: Run installed public API scenarios (packed consumer)
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/hikoutei-develop-consumer"
          mkdir -p "$consumer_dir"
          package_file="$(find "$RUNNER_TEMP/hikoutei-develop-package" -maxdepth 1 -name 'hikoutei-*.tgz' -type f -print -quit)"
          test -n "$package_file"

          # --- Packed tarball allowlist (Task 3 review correction) ---
          # Publication is blocked unless the ACTUAL packed tarball contains
          # only dist/** plus npm-mandatory metadata. The reusable checker
          # reads the tarball with tar, so it cannot be fooled by npm pack
          # --dry-run output or a stale source tree.
          node scripts/ci/assert-packed-tarball.mjs "$package_file"

          # The root package depends on the @hikoutei/ikisaki workspace
          # package; the verified artifact carries its pre-built tarball, so
          # the consumer install resolves locally without re-packing.
          ikisaki_package_path="$(find "$RUNNER_TEMP/hikoutei-develop-package/ikisaki" -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          test -n "$ikisaki_package_path"

          (
            cd "$consumer_dir"
            npm init -y >/dev/null
            npm install --no-audit --no-fund --ignore-scripts \
              "$ikisaki_package_path" \
              "$package_file" \
              "typescript@5.9.3" \
              "@mikro-orm/core@7.1.7" \
              "@mikro-orm/sql@7.1.7"
          )

          # --- Installed-consumer TypeScript typecheck (Task 3 review correction) ---
          # The JS runtime smoke never compiles an external consumer against
          # the packed dist/index.d.ts. The reusable checker copies the
          # dedicated consumer .ts into the throwaway consumer dir and runs the
          # INSTALLED TypeScript compiler against the INSTALLED tarball (never
          # repository source). It imports only the root `hikoutei` entrypoint,
          # defines a scalar entity, typechecks a createTypedSheets()/
          # EntityManager find() usage, and pins compile-time rejection guards
          # on internal symbols. It is typechecked only; nothing executes and
          # no Google credentials are required.
          node scripts/ci/run-consumer-typecheck.mjs --consumer-dir "$consumer_dir"

          # Both installed scenarios import ONLY the installed `hikoutei` root.
          cp scripts/ci/run-root-api-scenario.mjs "$consumer_dir/run-root-api-scenario.mjs"
          cp scripts/ci/run-public-api-surface.mjs "$consumer_dir/run-public-api-surface.mjs"
          cp scripts/ci/root-api-options.mjs "$consumer_dir/root-api-options.mjs"
          node "$consumer_dir/run-root-api-scenario.mjs" \
            --output="$RUNNER_TEMP/hikoutei-develop-root-api-smoke-result.json"
          node "$consumer_dir/run-public-api-surface.mjs" \
            --output="$RUNNER_TEMP/hikoutei-develop-public-api-surface-result.json"

      - name: Upload repository and installed-consumer reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hikoutei-develop-fake-reports
          path: |
            ${{ runner.temp }}/hikoutei-develop-fake-result.json
            ${{ runner.temp }}/hikoutei-develop-root-api-smoke-result.json
            ${{ runner.temp }}/hikoutei-develop-public-api-surface-result.json
          if-no-files-found: ignore

      - name: Upload develop package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: hikoutei-develop-package
          path: ${{ runner.temp }}/hikoutei-develop-package
          if-no-files-found: error

  publish:
    name: Publish develop package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: write is required for the GITHUB_TOKEN to create a
      # repository_dispatch event for the example verification workflows.
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Resolve publish mode
        id: resolve-mode
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RECOVERY_PATCH: ${{ inputs.recovery_patch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mode="tag"
          tag=""
          version=""
          source_ref=""
          recovery_patch=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            if [[ -n "$INPUT_SOURCE_REF" || -n "$INPUT_VERSION" ]]; then
              echo "tag is mutually exclusive with source_ref/version" >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          elif [[ -n "$INPUT_SOURCE_REF" || -n "$INPUT_VERSION" ]]; then
            if [[ -z "$INPUT_SOURCE_REF" || -z "$INPUT_VERSION" ]]; then
              echo "source_ref and version must be provided together for historical recovery" >&2
              exit 1
            fi
            mode="historical"
            source_ref="$INPUT_SOURCE_REF"
            version="$INPUT_VERSION"
          else
            echo "workflow_dispatch requires either tag or source_ref+version" >&2
            exit 1
          fi

          if [[ "$mode" == "tag" ]]; then
            if [[ "$tag" =~ ^develop-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            else
              echo "Develop release tag must be develop-vX.Y.Z: $tag" >&2
              exit 1
            fi
          else
            # Reject any non-SHA source_ref: a branch name, short SHA, or tag
            # could move during the run and break the audit trail. The caller
            # supplies an immutable PR head SHA.
            if [[ ! "$source_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "source_ref must be a full immutable commit SHA (40 hex chars): $source_ref" >&2
              exit 1
            fi
            source_ref="$(printf '%s' "$source_ref" | tr 'A-F' 'a-f')"
            # Strict numeric semver: no leading zeros, prerelease, or build
            # metadata, matching the release train's stable-version notion.
            if [[ ! "$version" =~ ^([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)$ ]]; then
              echo "version must be strict numeric semver X.Y.Z: $version" >&2
              exit 1
            fi
          fi

          # recovery_patch is an audited patch applied on top of the
          # historical source (see .github/recovery/patches/); it is valid
          # only in historical mode and is rejected in tag/push mode.
          if [[ -n "$INPUT_RECOVERY_PATCH" ]]; then
            if [[ "$mode" != "historical" ]]; then
              echo "recovery_patch is only valid with source_ref+version (historical recovery); rejected in tag mode" >&2
              exit 1
            fi
            # Constrain the patch to a relative path under the recovery
            # patches directory: no absolute paths, no .. traversal, and no
            # backslashes. The verify job fetches exactly this path from the
            # current develop commit; the publish job re-checks the recorded
            # path before any registry mutation.
            if [[ ! "$INPUT_RECOVERY_PATCH" =~ ^\.github/recovery/patches/[A-Za-z0-9._/-]+$ ]] \
              || [[ "$INPUT_RECOVERY_PATCH" == *".."* ]]; then
              echo "recovery_patch must be a relative path under .github/recovery/patches/: $INPUT_RECOVERY_PATCH" >&2
              exit 1
            fi
            recovery_patch="$INPUT_RECOVERY_PATCH"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "recovery_patch=$recovery_patch" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The checkout exists only so `git rev-parse HEAD` can prove this
          # job resolves to the exact commit behind the verified artifact.
          # Nothing from the working tree is executed here — registry reads
          # and version comparisons are inline, and both tarballs were built
          # by the unprivileged verify job. The token is never persisted.
          ref: ${{ github.event_name == 'push' && github.sha || (steps.resolve-mode.outputs.mode == 'historical' && steps.resolve-mode.outputs.source_ref || format('refs/tags/{0}', steps.resolve-mode.outputs.tag)) }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download develop package
        uses: actions/download-artifact@v7
        with:
          name: hikoutei-develop-package
          path: ${{ runner.temp }}/hikoutei-develop-package

      - name: Verify checked-out commit and version match verified artifact
        shell: bash
        env:
          MODE: ${{ steps.resolve-mode.outputs.mode }}
          SOURCE_REF: ${{ steps.resolve-mode.outputs.source_ref }}
          EXPECTED_VERSION: ${{ steps.resolve-mode.outputs.version }}
          RECOVERY_PATCH: ${{ steps.resolve-mode.outputs.recovery_patch }}
        run: |
          set -euo pipefail
          # Refuse any registry mutation unless the checkout resolves to the
          # exact commit (and, for historical recovery, the exact supplied
          # source SHA) that produced the verified artifact, at the exact
          # requested version recorded in the artifact.
          package_dir="$RUNNER_TEMP/hikoutei-develop-package"
          recorded_sha="$(cat "$package_dir/hikoutei-develop-tag-commit.sha")"
          recorded_version="$(cat "$package_dir/hikoutei-develop-requested-version.txt")"
          actual_sha="$(git rev-parse HEAD)"
          if [[ -z "$recorded_sha" || -z "$recorded_version" || "$actual_sha" != "$recorded_sha" ]]; then
            echo "artifact provenance mismatch: verified_sha=$recorded_sha verified_version=$recorded_version checked-out=$actual_sha" >&2
            exit 1
          fi
          if [[ "$recorded_version" != "$EXPECTED_VERSION" ]]; then
            echo "artifact version mismatch: recorded=$recorded_version expected=$EXPECTED_VERSION" >&2
            exit 1
          fi
          if [[ "$MODE" == "historical" && -n "$SOURCE_REF" && "$actual_sha" != "$SOURCE_REF" ]]; then
            echo "historical recovery checked out $actual_sha but source_ref is $SOURCE_REF" >&2
            exit 1
          fi
          # Audited recovery patch records: when a recovery_patch was
          # supplied, the artifact must carry both records and they must be
          # internally valid — the recorded path must equal the validated
          # input, and the sha256 record must be a well-formed checksum line
          # naming the patch file. When no patch was supplied, the artifact
          # must carry no such records. All of this is verified before any
          # registry mutation; this job never executes source-controlled
          # scripts, and the patch itself was never executed either.
          if [[ "$MODE" == "historical" && -n "$RECOVERY_PATCH" ]]; then
            patch_path_file="$package_dir/hikoutei-recovery-patch-path.txt"
            patch_sha_file="$package_dir/hikoutei-recovery-patch.sha256"
            if [[ ! -f "$patch_path_file" || ! -s "$patch_path_file" || ! -f "$patch_sha_file" || ! -s "$patch_sha_file" ]]; then
              echo "artifact is missing recovery patch records for $RECOVERY_PATCH" >&2
              exit 1
            fi
            recorded_path="$(cat "$patch_path_file")"
            if [[ "$recorded_path" != "$RECOVERY_PATCH" ]]; then
              echo "artifact recovery patch mismatch: recorded=$recorded_path input=$RECOVERY_PATCH" >&2
              exit 1
            fi
            if ! grep -qE '^[0-9a-f]{64}  hikoutei-recovery\.patch$' "$patch_sha_file"; then
              echo "artifact recovery patch sha256 record is malformed: $(cat "$patch_sha_file")" >&2
              exit 1
            fi
          elif [[ -e "$package_dir/hikoutei-recovery-patch-path.txt" || -e "$package_dir/hikoutei-recovery-patch.sha256" ]]; then
            echo "artifact carries recovery patch records but no recovery_patch input was given" >&2
            exit 1
          fi
          echo "Checked out $actual_sha for $EXPECTED_VERSION matching the verified artifact."

      - name: Preflight registry channels before any write
        id: preflight
        # All channel monotonicity and package existence are checked with
        # authenticated, fail-closed reads BEFORE any registry write
        # (including ikisaki publish/dist-tag repair), so no step can move a
        # channel backward and then fail, and no publish step re-queries a
        # registry after the first write. Results are persisted as step
        # outputs and consumed by the publish steps below.
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.resolve-mode.outputs.mode }}
          CHANNEL_TAG: ${{ steps.resolve-mode.outputs.mode == 'historical' && 'historical' || 'latest' }}
          EXPECTED_VERSION: ${{ steps.resolve-mode.outputs.version }}
        run: |
          set -euo pipefail
          expected_version="$EXPECTED_VERSION"
          channel_tag="$CHANNEL_TAG"
          package_dir="$RUNNER_TEMP/hikoutei-develop-package"

          # Both registry tokens must be present before any query: npmjs
          # reads need NPM_TOKEN, GitHub Packages reads need GITHUB_TOKEN.
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN secret is required for authenticated npmjs preflight." >&2
            exit 1
          fi
          if [[ -z "$GH_PACKAGES_TOKEN" ]]; then
            echo "GITHUB_TOKEN is required for authenticated GitHub Packages preflight." >&2
            exit 1
          fi
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_PACKAGES_TOKEN" > .npmrc

          # Fail-closed inline dist-tag read (no source-controlled scripts):
          # prints the current tag version, or empty when the tag/package is
          # absent; any other registry error aborts.
          read_dist_tag() {
            local output
            if output="$(npm view "$1" "dist-tags.$2" --json --registry="$3" 2>&1)"; then
              node -e '
                const raw = process.argv[1].trim();
                if (raw === "" || raw === "null" || raw === "undefined") process.exit(0);
                try {
                  const v = JSON.parse(raw);
                  if (typeof v === "string" && v.length > 0) { process.stdout.write(v); process.exit(0); }
                } catch {}
                if (/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(raw)) { process.stdout.write(raw); process.exit(0); }
                process.stderr.write("unexpected dist-tag value: " + raw + "\n");
                process.exit(1);
              ' "$output"
            else
              if grep -qE 'E404|404 Not Found' <<<"$output"; then return 0; fi
              echo "npm view failed for $1 dist-tags.$2: $output" >&2
              exit 1
            fi
          }

          # Aborts when target would move the channel backward; an empty
          # current tag (first write) is always allowed.
          check_monotonic() {
            local current="$1" target="$2" label="$3"
            if [[ -z "$current" ]]; then
              echo "$label: no existing tag; first write allowed"
              return 0
            fi
            if node -e '
              const [a, b] = process.argv.slice(1).map((v) => v.split(".").map((n) => BigInt(n)));
              for (let i = 0; i < 3; i++) { if (a[i] > b[i]) process.exit(1); if (a[i] < b[i]) process.exit(0); }
              process.exit(0);
            ' "$current" "$target"; then
              echo "$label: current=$current target=$target"
            else
              echo "refusing to move $label backward: current=$current target=$target" >&2
              exit 1
            fi
          }

          # Authenticated existence check: prints 1 when the exact version
          # exists, 0 on a genuine 404; any other registry error aborts.
          check_exists() {
            local pkg="$1" version="$2" registry="$3"
            if output="$(npm view "$pkg@$version" version --registry="$registry" 2>&1)"; then
              echo 1
            elif grep -qE 'E404|404 Not Found' <<<"$output"; then
              echo 0
            else
              echo "npm view failed for $pkg@$version: $output" >&2
              exit 1
            fi
          }

          # 1. npmjs hikoutei: exact-version existence plus channel.
          root_current="$(read_dist_tag hikoutei "$channel_tag" https://registry.npmjs.org)"
          check_monotonic "$root_current" "$expected_version" "npmjs hikoutei $channel_tag"
          root_npmjs_exists="$(check_exists hikoutei "$expected_version" https://registry.npmjs.org)"

          # 2. npmjs @hikoutei/ikisaki: the verified artifact records the
          #    pinned version; existence decides whether this run publishes it
          #    or only repairs the tag. Channel monotonicity is checked
          #    whenever this run will write that channel tag: tag mode always
          #    (publish and repair both target `latest`), historical mode only
          #    when the pinned version is missing and must be published under
          #    `historical`.
          if [[ ! -f "$package_dir/ikisaki/version.txt" ]]; then
            echo "verified artifact is missing the ikisaki version record" >&2
            exit 1
          fi
          ikisaki_version="$(cat "$package_dir/ikisaki/version.txt")"
          ikisaki_npmjs_exists="$(check_exists "@hikoutei/ikisaki" "$ikisaki_version" https://registry.npmjs.org)"
          ikisaki_writes_channel=0
          if [[ "$MODE" == "tag" || "$ikisaki_npmjs_exists" == "0" ]]; then
            ikisaki_writes_channel=1
          fi
          if [[ "$ikisaki_writes_channel" -eq 1 ]]; then
            ikisaki_current="$(read_dist_tag @hikoutei/ikisaki "$channel_tag" https://registry.npmjs.org)"
            check_monotonic "$ikisaki_current" "$ikisaki_version" "npmjs @hikoutei/ikisaki $channel_tag"
          fi

          # 3. GitHub Packages mirror: existence and channel (reads use the
          #    token in the .npmrc written above).
          gh_current="$(read_dist_tag @ManddarinShop/hikoutei "$channel_tag" https://npm.pkg.github.com)"
          check_monotonic "$gh_current" "$expected_version" "GitHub Packages @ManddarinShop/hikoutei $channel_tag"
          gh_packages_exists="$(check_exists "@ManddarinShop/hikoutei" "$expected_version" https://npm.pkg.github.com)"

          # Persist results: publish steps consume these outputs and never
          # re-query a registry after the first write.
          echo "channel_tag=$channel_tag" >> "$GITHUB_OUTPUT"
          echo "root_npmjs_exists=$root_npmjs_exists" >> "$GITHUB_OUTPUT"
          echo "ikisaki_version=$ikisaki_version" >> "$GITHUB_OUTPUT"
          echo "ikisaki_npmjs_exists=$ikisaki_npmjs_exists" >> "$GITHUB_OUTPUT"
          echo "gh_packages_exists=$gh_packages_exists" >> "$GITHUB_OUTPUT"

      - name: Publish ikisaki package (idempotent)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          MODE: ${{ steps.resolve-mode.outputs.mode }}
          CHANNEL_TAG: ${{ steps.preflight.outputs.channel_tag }}
          IKISAKI_VERSION: ${{ steps.preflight.outputs.ikisaki_version }}
          IKISAKI_EXISTS: ${{ steps.preflight.outputs.ikisaki_npmjs_exists }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish the ikisaki package." >&2
            exit 1
          fi
          # The hikoutei tarball depends on the exact @hikoutei/ikisaki
          # version declared in the workspace manifest, so that version must
          # exist on the registry before hikoutei is published. Existence and
          # channel monotonicity were preflighted (authenticated, before any
          # write); this step consumes those results and never re-queries a
          # registry. Version and tarball come from the verified artifact; no
          # source-controlled code is built or run in this job.
          package_dir="$RUNNER_TEMP/hikoutei-develop-package"
          ikisaki_version="$IKISAKI_VERSION"
          if [[ ! "$ikisaki_version" =~ ^([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)$ ]]; then
            echo "ikisaki version must be strict numeric semver X.Y.Z: $ikisaki_version" >&2
            exit 1
          fi
          if [[ "$IKISAKI_EXISTS" == "1" ]]; then
            # Version already exists. Tag mode ensures the `latest` dist-tag
            # (monotonicity preflighted). Historical recovery must not touch
            # `latest`: the old ikisaki version is the tarball's pinned
            # dependency and only needs to exist, which it already does.
            if [[ "$MODE" == "tag" ]]; then
              npm dist-tag add "@hikoutei/ikisaki@${ikisaki_version}" latest --registry=https://registry.npmjs.org
              echo "@hikoutei/ikisaki@${ikisaki_version} already published; ensured latest dist-tag."
            else
              echo "@hikoutei/ikisaki@${ikisaki_version} already published; nothing to repair in historical mode."
            fi
          else
            # The pinned ikisaki version is missing from the registry (the
            # original release never made it there). Verify the exact
            # artifact before publishing: exactly one tarball, matching
            # checksum, and package name/version read from inside the tarball.
            mapfile -t ikisaki_tarballs < <(find "$package_dir/ikisaki" -maxdepth 1 -name '*.tgz' -type f -print)
            if [[ "${#ikisaki_tarballs[@]}" -ne 1 ]]; then
              echo "expected exactly one ikisaki tarball, found ${#ikisaki_tarballs[@]}" >&2
              exit 1
            fi
            ikisaki_tarball="${ikisaki_tarballs[0]}"
            checksum_file="$package_dir/ikisaki/hikoutei-ikisaki.sha256"
            if [[ ! -f "$checksum_file" ]]; then
              echo "missing ikisaki checksum file $checksum_file" >&2
              exit 1
            fi
            # Assert the checksum line names the tarball we actually publish,
            # not merely any file sha256sum --check happens to find.
            expected_name="$(basename "$ikisaki_tarball")"
            recorded_name="$(awk 'NR==1{n=$2; sub(/^\*/,"",n); print n}' "$checksum_file")"
            if [[ "$recorded_name" != "$expected_name" ]]; then
              echo "ikisaki checksum names '$recorded_name' but tarball is '$expected_name'" >&2
              exit 1
            fi
            (cd "$package_dir/ikisaki" && sha256sum --check hikoutei-ikisaki.sha256)
            tar -xOf "$ikisaki_tarball" package/package.json > "$RUNNER_TEMP/hikoutei-ikisaki-package.json"
            node -e '
              const pkg = require(process.argv[1]);
              const expected = process.argv[2];
              if (pkg.name !== "@hikoutei/ikisaki" || pkg.version !== expected) process.exit(1);
            ' "$RUNNER_TEMP/hikoutei-ikisaki-package.json" "$ikisaki_version"
            # Publish the verified pre-built tarball under the recovery
            # channel tag; never `latest` in historical mode.
            npm publish "$ikisaki_tarball" --tag "$CHANNEL_TAG" --access public --provenance
          fi

      - name: Publish develop package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANNEL_TAG: ${{ steps.preflight.outputs.channel_tag }}
          EXPECTED_VERSION: ${{ steps.resolve-mode.outputs.version }}
          ROOT_EXISTS: ${{ steps.preflight.outputs.root_npmjs_exists }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish the develop package." >&2
            exit 1
          fi
          expected_version="$EXPECTED_VERSION"
          # The resolve step already validated the mode's version derivation
          # (develop-vX.Y.Z tag or strict numeric input); re-assert the strict
          # shape here so a bad resolved value fails before any registry write.
          if [[ ! "$expected_version" =~ ^([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)$ ]]; then
            echo "resolved version must be strict numeric semver X.Y.Z: $expected_version" >&2
            exit 1
          fi
          package_dir="$RUNNER_TEMP/hikoutei-develop-package"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -name 'hikoutei-*.tgz' -type f -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "expected exactly one develop package, found ${#packages[@]}" >&2
            exit 1
          fi
          package_file="${packages[0]}"
          checksum_file="$package_dir/hikoutei-develop-package.sha256"
          if [[ ! -f "$checksum_file" ]]; then
            echo "missing develop checksum file $checksum_file" >&2
            exit 1
          fi
          # Assert the checksum line names the tarball we actually publish, not
          # merely any file that sha256sum --check happens to find in the dir.
          expected_name="$(basename "$package_file")"
          recorded_name="$(awk 'NR==1{n=$2; sub(/^\*/,"",n); print n}' "$checksum_file")"
          if [[ "$recorded_name" != "$expected_name" ]]; then
            echo "develop checksum names '$recorded_name' but tarball is '$expected_name'" >&2
            exit 1
          fi
          (cd "$package_dir" && sha256sum --check hikoutei-develop-package.sha256)
          tar -xOf "$package_file" package/package.json > "$RUNNER_TEMP/hikoutei-develop-package.json"
          node -e '
            const pkg = require(process.argv[1]);
            const expected = process.argv[2];
            const isStable = /^\d+\.\d+\.\d+$/.test(pkg.version);
            if (pkg.name !== "hikoutei" || !isStable || pkg.version !== expected) process.exit(1);
          ' "$RUNNER_TEMP/hikoutei-develop-package.json" "$expected_version"
          # Existence and channel monotonicity were preflighted (authenticated,
          # before any write); this step consumes those results and never
          # re-queries a registry after a write. Idempotent recovery: a manual
          # retry of an already-published version must not fail the workflow.
          # When the exact version already exists, repair/ensure the channel
          # dist-tag instead of merely skipping; the preflight step already
          # failed the workflow if the target would move the channel backward.
          # Historical recovery writes only the `historical` dist-tag and
          # never `latest`.
          if [[ "$ROOT_EXISTS" == "1" ]]; then
            npm dist-tag add "hikoutei@${expected_version}" "$CHANNEL_TAG" --registry=https://registry.npmjs.org
            echo "hikoutei@${expected_version} already published on npmjs; ensured $CHANNEL_TAG dist-tag."
          else
            npm publish "$package_file" --tag "$CHANNEL_TAG" --access public --provenance
          fi

      - name: Publish to GitHub Packages mirror
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL_TAG: ${{ steps.preflight.outputs.channel_tag }}
          EXPECTED_VERSION: ${{ steps.resolve-mode.outputs.version }}
          GH_EXISTS: ${{ steps.preflight.outputs.gh_packages_exists }}
        run: |
          set -euo pipefail
          expected_version="$EXPECTED_VERSION"
          package_dir="$RUNNER_TEMP/hikoutei-develop-package"
          scoped_dir="$RUNNER_TEMP/hikoutei-develop-gh-packages"
          rm -rf "$scoped_dir"
          mkdir -p "$scoped_dir"
          # The GitHub Packages npm registry only hosts scoped packages, so the
          # verified tarball is re-packed under @ManddarinShop/hikoutei. The
          # npmjs release keeps the unscoped name; contents are identical.
          package_file="$(find "$package_dir" -maxdepth 1 -name 'hikoutei-*.tgz' -type f -print -quit)"
          test -n "$package_file"
          tar -xzf "$package_file" -C "$scoped_dir"
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const expected = process.argv[2];
            const pkg = JSON.parse(fs.readFileSync(dir + "/package/package.json", "utf8"));
            if (pkg.name !== "hikoutei" || pkg.version !== expected) process.exit(1);
            pkg.name = "@ManddarinShop/hikoutei";
            fs.writeFileSync(dir + "/package/package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$scoped_dir" "$expected_version"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_PACKAGES_TOKEN" > .npmrc
          # Existence and channel monotonicity were preflighted (authenticated,
          # before any write) and this step consumes those results; it never
          # re-queries a registry after a write. Idempotent recovery: when the
          # exact version already exists, ensure the channel dist-tag
          # (monotonic) instead of failing; when it is missing, publish.
          if [[ "$GH_EXISTS" == "1" ]]; then
            npm dist-tag add "@ManddarinShop/hikoutei@${expected_version}" "$CHANNEL_TAG" --registry=https://npm.pkg.github.com
            echo "@ManddarinShop/hikoutei@${expected_version} already published on GitHub Packages; ensured $CHANNEL_TAG dist-tag."
          else
            (cd "$scoped_dir" && tar -czf "$RUNNER_TEMP/hikoutei-develop-gh-packages.tgz" package)
            npm publish "$RUNNER_TEMP/hikoutei-develop-gh-packages.tgz" \
              --registry=https://npm.pkg.github.com \
              --tag "$CHANNEL_TAG" --access public
          fi

      - name: Dispatch example verification
        # Tag/push releases dispatch the example verification workflows.
        # Historical recovery deliberately does not: it is an audited
        # backfill of old versions and must not trigger remote dispatches.
        if: steps.resolve-mode.outputs.mode == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.resolve-mode.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          version="${version#develop-v}"
          # The repository_dispatch API requires client_payload as a JSON
          # object; -f would send it as a string and fail with HTTP 422, so
          # the whole request body is passed through stdin as JSON.
          body="{\"event_type\":\"examples-verify\",\"client_payload\":{\"version\":\"$version\"}}"
          if ! printf '%s' "$body" | gh api repos/${{ github.repository }}/dispatches \
            -X POST --input - >/dev/null; then
            echo "warning: failed to dispatch example verification for $version" >&2
          fi
