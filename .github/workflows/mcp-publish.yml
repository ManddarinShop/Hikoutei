name: Publish spreadsheet-db-mcp package

# Triggered by an mcp release tag such as mcp-v0.1.0. The tag must point at
# a commit on main that is at or past the hikoutei core release the package
# depends on (the workspace hikoutei version must satisfy the patched
# dependency spec and that version must already exist on npmjs).
#
# Unlike the core package, spreadsheet-db-mcp keeps `"private": true` and a
# workspace `file:../..` dependency in the repository so branch CI never
# needs an unpublished registry version. This workflow patches both at
# publish time only: the dependency becomes `^<core version>` and the
# private flag is stripped, the resulting tarball is asserted clean, and a
# bare consumer install smoke runs against the packed artifact before the
# idempotent publish step (mirroring the ikisaki publish step).
on:
  push:
    tags:
      - 'mcp-v[0-9]*'

concurrency:
  # Serialize every mcp publish so the channel cannot move backward.
  group: mcp-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-publish:
    name: Verify and publish spreadsheet-db-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        # Version is read from the packageManager field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Validate release tag matches the mcp package version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG_NAME" =~ ^mcp-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "MCP release tag must be mcp-vX.Y.Z: $TAG_NAME" >&2
            exit 1
          fi
          mcp_version="$(node -p "require('./packages/mcp/package.json').version")"
          if [[ "$mcp_version" != "$expected_version" ]]; then
            echo "packages/mcp version ($mcp_version) does not match tag ($TAG_NAME)" >&2
            exit 1
          fi
          test "$(node -p "require('./packages/mcp/package.json').name")" = "spreadsheet-db-mcp"

      - name: Read core version and verify it is published
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(node -p "require('./package.json').version")"
          echo "core_version=$core_version" >> "$GITHUB_ENV"
          published="$(npm view "hikoutei@${core_version}" version --registry=https://registry.npmjs.org)"
          test "$published" = "$core_version"

      - name: Patch mcp manifest for publish (dependency + private flag)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const pkg = JSON.parse(await readFile("./packages/mcp/package.json", "utf8"));
          const coreVersion = process.env.core_version;
          if (pkg.private !== true) throw new Error("expected private:true in the repo manifest");
          if (pkg.dependencies.hikoutei !== "file:../..") {
            throw new Error("expected the workspace file:../.. hikoutei dependency in the repo manifest");
          }
          delete pkg.private;
          pkg.dependencies.hikoutei = `^${coreVersion}`;
          await writeFile("./packages/mcp/package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE
          # The workspace root version satisfies the patched range, so this
          # still links hikoutei locally for typecheck/test/build. The manifest
          # was just patched, so the install must re-resolve (no frozen
          # lockfile) as a publish-time-only deviation.
          pnpm install --no-frozen-lockfile

      - name: Typecheck production code
        run: pnpm run typecheck

      - name: Typecheck tests
        run: pnpm run typecheck:test

      - name: Run unit and contract tests
        run: pnpm test

      - name: Build packages
        run: pnpm run build

      - name: Pack and assert the publishable tarball
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/spreadsheet-db-mcp-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          package_file="$(cd packages/mcp && npm pack --silent --pack-destination "$package_dir")"
          package_path="$package_dir/$package_file"
          test -f "$package_path"
          echo "package_path=$package_path" >> "$GITHUB_ENV"

          # Assert the patched manifest inside the actual tarball: no
          # private flag, no file: spec, real version range, engine deps,
          # and the built dist payload (a tag whose root build script lost
          # the mcp workspace step would otherwise pack an empty shell).
          tar -xOf "$package_path" package/package.json > "$RUNNER_TEMP/mcp-packed-package.json"
          # List the tarball once into a file and grep the file: piping tar
          # into `grep -q` makes grep exit at the first match, SIGPIPEs GNU
          # tar mid-write, and pipefail then reports a bogus "missing" error
          # even though the file is present.
          tar -tzf "$package_path" > "$RUNNER_TEMP/mcp-tar-list.txt"
          for required_file in dist/index.js dist/tools.js dist/config.js dist/env.js dist/values.js; do
            if ! grep -qx "package/$required_file" "$RUNNER_TEMP/mcp-tar-list.txt"; then
              echo "packed tarball is missing $required_file — was packages/mcp/dist built?" >&2
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const pkg = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/mcp-packed-package.json", "utf8"));
          const coreVersion = process.env.core_version;
          const problems = [];
          if (pkg.private !== undefined) problems.push("packed manifest still has private:true");
          if (pkg.dependencies.hikoutei !== `^${coreVersion}`) {
            problems.push(`packed hikoutei dependency is ${pkg.dependencies.hikoutei}, expected ^${coreVersion}`);
          }
          if (pkg.dependencies["@mikro-orm/core"] !== "7.1.7") problems.push("packed @mikro-orm/core dependency missing");
          if (pkg.dependencies["@mikro-orm/sql"] !== "7.1.7") problems.push("packed @mikro-orm/sql dependency missing");
          if (!pkg.bin || pkg.bin["spreadsheet-db-mcp"] !== "./dist/index.js") problems.push("packed bin entry missing");
          if (problems.length > 0) {
            console.error(problems.join("; "));
            process.exit(1);
          }
          NODE

      - name: Run consumer smoke against the packed tarball
        run: node scripts/ci/run-mcp-consumer-smoke.mjs --package "${{ env.package_path }}"

      - name: Publish spreadsheet-db-mcp (idempotent)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish spreadsheet-db-mcp." >&2
            exit 1
          fi
          mcp_version="$(node -p "require('./packages/mcp/package.json').version")"
          if npm view "spreadsheet-db-mcp@${mcp_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "spreadsheet-db-mcp@${mcp_version} already published; skipping."
          else
            npm publish "${{ env.package_path }}" --tag latest --access public --provenance
          fi

      - name: Deprecate the previous package name (idempotent)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # hikoutei-mcp@0.1.0 was the first published name; it is deprecated
          # in favor of the discoverable spreadsheet-db-mcp name. Safe to run
          # repeatedly: deprecation is idempotent and skipped when the version
          # was never published (e.g. first release before the rename).
          if npm view "hikoutei-mcp@0.1.0" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            npm deprecate "hikoutei-mcp@0.1.0" "Renamed to spreadsheet-db-mcp — use npx -y spreadsheet-db-mcp"
          else
            echo "hikoutei-mcp@0.1.0 not published; nothing to deprecate."
          fi
