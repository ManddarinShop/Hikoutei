name: Live Google Sheets integration

# Opt-in only. The live scenario contacts real Google Sheets using repository
# secrets, so it never runs automatically on pull requests or pushes; a
# maintainer with write access dispatches it explicitly. Manual dispatch is the
# only trigger, so there is no forked-PR secret-exposure path and no need for
# the pull_request/pull_request_target distinction.
#
# The live path is service-account-only: the scenario provisions, writes,
# observes, and cleans up through the Google Sheets REST API with Application
# Default Credentials. The service-account provider needs no Apps Script
# and no TYPED_SHEETS_GATEWAY_* secrets.
on:
  workflow_dispatch:

# All live runs share one spreadsheet, so serialize manual dispatches to avoid
# quota contention between concurrent service accounts.
concurrency:
  group: live-google-sheets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: Repository Google Sheets service-account sync/provider E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run repository internal sync/provider E2E (live, service account)
        # The internal harness runs from the checked-out repository against its
        # own built dist/ tree; no consumer install is involved. The
        # service-account key is materialized in the runner temp dir and the
        # credential/spreadsheet env vars are scoped to this step and the
        # cleanup step only, not the whole job, so checkout/setup/install/build
        # never see them.
        env:
          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_TEST_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_TEST_SPREADSHEET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa-key.json"
          node scripts/ci/run-api-scenario.mjs \
            --backend=live \
            --outbound=direct \
            --output="$RUNNER_TEMP/hikoutei-live-result.json" \
            --manifest="$RUNNER_TEMP/hikoutei-live-manifest.json" \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Clean up live fixture
        # Cleanup also talks to the live spreadsheet with the service account,
        # so it needs the same credential env; the key file is still present
        # because this step runs in the same job. The repository-owned harness
        # handles a missing manifest gracefully (nothing to clean).
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_TEST_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_TEST_SPREADSHEET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/hikoutei-live-manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "Live scenario did not create a manifest; there is no fixture to clean."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa-key.json"
          node scripts/ci/run-api-scenario.mjs \
            --backend=live \
            --outbound=direct \
            --cleanup-only \
            --manifest="$manifest"
          rm -f "$RUNNER_TEMP/gcp-sa-key.json"

      - name: Upload internal sync/provider E2E report (live, service account)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hikoutei-live-google-sheets-direct
          path: |
            ${{ runner.temp }}/hikoutei-live-result.json
            ${{ runner.temp }}/hikoutei-live-manifest.json
          if-no-files-found: ignore
