name: Live Google Sheets integration

# Opt-in only. The live scenario contacts real Google Sheets using repository
# secrets, so it never runs automatically on pull requests or pushes; a
# maintainer with write access dispatches it explicitly. Manual dispatch is the
# only trigger, so there is no forked-PR secret-exposure path and no need for
# the pull_request/pull_request_target distinction.
on:
  workflow_dispatch:

# All live runs share one deployed gateway and spreadsheet, so serialize manual
# dispatches to avoid quota and SpreadsheetApp contention.
concurrency:
  group: live-google-sheets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: Installed-package Google Sheets internal sync/gateway E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run installed-package internal sync/gateway E2E (live)
        # The gateway secrets are scoped to this step and the cleanup step only,
        # not the whole job, so checkout/setup/install/build never see them.
        env:
          TYPED_SHEETS_GATEWAY_URL: ${{ secrets.TYPED_SHEETS_GATEWAY_URL }}
          TYPED_SHEETS_GATEWAY_SHARED_SECRET: ${{ secrets.TYPED_SHEETS_GATEWAY_SHARED_SECRET }}
          TYPED_SHEETS_GATEWAY_SHEET_ID: ${{ secrets.TYPED_SHEETS_GATEWAY_SHEET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/hikoutei-live-consumer"
          mkdir -p "$consumer_dir"
          pack_file="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          pack_path="$RUNNER_TEMP/$pack_file"

          (
            cd "$consumer_dir"
            npm init -y >/dev/null
            npm install --no-audit --no-fund --ignore-scripts \
              "$pack_path" \
              "@mikro-orm/core@7.1.7" \
              "@mikro-orm/sql@7.1.7"
          )

          cp scripts/ci/run-api-scenario.mjs "$consumer_dir/run-api-scenario.mjs"
          node "$consumer_dir/run-api-scenario.mjs" \
            --backend=live \
            --output="$RUNNER_TEMP/hikoutei-live-result.json" \
            --manifest="$RUNNER_TEMP/hikoutei-live-manifest.json" \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Clean up live fixture
        # Cleanup also talks to the live gateway, so it needs the same secrets.
        if: always()
        env:
          TYPED_SHEETS_GATEWAY_URL: ${{ secrets.TYPED_SHEETS_GATEWAY_URL }}
          TYPED_SHEETS_GATEWAY_SHARED_SECRET: ${{ secrets.TYPED_SHEETS_GATEWAY_SHARED_SECRET }}
          TYPED_SHEETS_GATEWAY_SHEET_ID: ${{ secrets.TYPED_SHEETS_GATEWAY_SHEET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/hikoutei-live-consumer/run-api-scenario.mjs"
          if [ ! -f "$runner" ]; then
            echo "Live runner was not installed; there is no fixture to clean."
            exit 0
          fi
          node "$runner" \
            --backend=live \
            --cleanup-only \
            --manifest="$RUNNER_TEMP/hikoutei-live-manifest.json"

      - name: Upload internal sync/gateway E2E report (live)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hikoutei-live-sync-gateway-e2e
          path: |
            ${{ runner.temp }}/hikoutei-live-result.json
            ${{ runner.temp }}/hikoutei-live-manifest.json
          if-no-files-found: ignore
