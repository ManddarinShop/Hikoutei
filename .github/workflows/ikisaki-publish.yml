name: Publish ikisaki only

# Recovery publication for the @hikoutei/ikisaki package, decoupled from the
# hikoutei develop release. Used to publish an already-versioned ikisaki
# (e.g. the 0.1.3 that blocked develop publishes because it was never on npm)
# without touching any hikoutei tag or branch.
#
# The checked-out ref must contain the `repository` metadata in
# packages/ikisaki/package.json so provenance publication succeeds. The
# workflow is idempotent: if the exact version already exists on npm, it only
# re-applies the `latest` dist-tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to build ikisaki from (must have repository metadata)'
        required: false
        default: 'fix/ikisaki-repository-provenance'

concurrency:
  group: ikisaki-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-ikisaki:
    name: Publish ikisaki package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        # Version is read from the packageManager field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Validate ikisaki manifest
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./packages/ikisaki/package.json");
            if (pkg.name !== "@hikoutei/ikisaki") process.exit(1);
            if (!pkg.repository || !pkg.repository.url) {
              console.error("ikisaki package.json is missing repository metadata for provenance publish");
              process.exit(1);
            }
            console.log("ikisaki", pkg.version, "repository", pkg.repository.url);
          '

      - name: Publish ikisaki (idempotent)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish the ikisaki package." >&2
            exit 1
          fi
          version="$(node -p "require('./packages/ikisaki/package.json').version")"
          if npm view "@hikoutei/ikisaki@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@hikoutei/ikisaki@${version} already published; re-applying latest dist-tag."
            npm dist-tag add "@hikoutei/ikisaki@${version}" latest --registry=https://registry.npmjs.org
          else
            # npm publish below is deliberate (registry act, unchanged until
            # P8-DD); the INSTALL and BUILD run through pnpm.
            pnpm install --frozen-lockfile
            pnpm --filter @hikoutei/ikisaki run build
            (cd packages/ikisaki && npm publish --tag latest --access public --provenance)
          fi
