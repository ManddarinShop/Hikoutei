name: Publish stable package

# Triggered by a numeric release tag such as v0.4.0. The main-version
# workflow creates the version commit and tag; this workflow only verifies and
# publishes the tagged package.
on:
  push:
    tags:
      - 'v[0-9]*'

concurrency:
  # Serialize every stable publish so latest cannot move backward due to two
  # tag workflows finishing out of order.
  group: stable-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify stable package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        # Version is read from the packageManager field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release tag matches package versions
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "Release tag must be a numeric vX.Y.Z semver: $TAG_NAME" >&2
            exit 1
          fi

          pkg_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          echo "tag=$TAG_NAME expected_version=$expected_version package.json=$pkg_version package-lock.json=$lock_version"

          if [[ "$pkg_version" != "$expected_version" ]]; then
            echo "package.json version ($pkg_version) does not match tag ($TAG_NAME)" >&2
            exit 1
          fi
          if [[ "$lock_version" != "$expected_version" ]]; then
            echo "package-lock.json top-level version ($lock_version) does not match tag ($TAG_NAME)" >&2
            exit 1
          fi
          if [[ "$lock_root_version" != "$expected_version" ]]; then
            echo "package-lock.json root packages version ($lock_root_version) does not match tag ($TAG_NAME)" >&2
            exit 1
          fi
          test "$(node -p "require('./package.json').name")" = "hikoutei"

      - name: Verify public Kohkai dependency
        shell: bash
        run: |
          set -euo pipefail
          kohkai_version="$(node -p "require('./package.json').dependencies['@hikoutei/kohkai'] || ''")"
          test -n "$kohkai_version"
          published_kohkai_version="$(npm view "@hikoutei/kohkai@$kohkai_version" version --registry=https://registry.npmjs.org)"
          test "$published_kohkai_version" = "$kohkai_version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck production code
        run: pnpm run typecheck

      - name: Typecheck tests
        run: pnpm run typecheck:test

      - name: Run unit and contract tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

      - name: Verify package name and contents
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "hikoutei"
          npm pack --dry-run

      - name: Pack stable package
        shell: bash
        run: |
          set -euo pipefail
          # Keep the tarball and its checksum together in a dedicated directory so
          # the artifact and publish job reason about a single, self-contained path.
          package_dir="$RUNNER_TEMP/hikoutei-stable-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          package_file="$(npm pack --silent --pack-destination "$package_dir")"
          package_path="$package_dir/$package_file"
          test -f "$package_path"
          tar -xOf "$package_path" package/package.json > "$RUNNER_TEMP/hikoutei-stable-package.json"
          node -e '
            const pkg = require(process.argv[1]);
            const isStable = /^\d+\.\d+\.\d+$/.test(pkg.version);
            if (pkg.name !== "hikoutei" || !isStable) process.exit(1);
          ' "$RUNNER_TEMP/hikoutei-stable-package.json"
          (cd "$package_dir" && sha256sum "$package_file" > hikoutei-stable-package.sha256)
          echo "Packed $package_path"

      - name: Run repository internal sync/provider E2E (fake)
        shell: bash
        run: |
          set -euo pipefail
          # Internal sync/provider E2E: loads repository source modules through
          # the checked-in TypeScript loader; it is not a package compatibility
          # test.
          node --loader ./scripts/ci/source-ts-loader.mjs scripts/ci/run-api-scenario.mjs \
            --backend=fake \
            --output="$RUNNER_TEMP/hikoutei-stable-fake-result.json" \
            --manifest="$RUNNER_TEMP/hikoutei-stable-fake-manifest.json"

      - name: Run installed public API scenarios (packed consumer)
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/hikoutei-stable-consumer"
          mkdir -p "$consumer_dir"
          package_file="$(find "$RUNNER_TEMP/hikoutei-stable-package" -maxdepth 1 -name 'hikoutei-*.tgz' -type f -print -quit)"
          test -n "$package_file"

          # --- Packed tarball allowlist (Task 3 review correction) ---
          # Publication is blocked unless the ACTUAL packed tarball contains
          # only dist/** plus npm-mandatory metadata. The reusable checker
          # reads the tarball with tar, so it cannot be fooled by npm pack
          # --dry-run output or a stale source tree.
          node scripts/ci/assert-packed-tarball.mjs "$package_file"

          # The root package depends on the @hikoutei/ikisaki workspace
          # package; pack it too so the consumer install resolves locally.
          ikisaki_package_file="$(cd packages/ikisaki && npm pack --silent --pack-destination "$RUNNER_TEMP")"
          ikisaki_package_path="$RUNNER_TEMP/$ikisaki_package_file"

          (
            cd "$consumer_dir"
            npm init -y >/dev/null
            npm install --no-audit --no-fund --ignore-scripts \
              "$ikisaki_package_path" \
              "$package_file" \
              "typescript@5.9.3" \
              "@mikro-orm/core@7.1.7" \
              "@mikro-orm/sql@7.1.7"
          )

          # --- Installed-consumer TypeScript typecheck (Task 3 review correction) ---
          # The JS runtime smoke never compiles an external consumer against
          # the packed dist/index.d.ts. The reusable checker copies the
          # dedicated consumer .ts into the throwaway consumer dir and runs the
          # INSTALLED TypeScript compiler against the INSTALLED tarball (never
          # repository source). It imports only the root `hikoutei` entrypoint,
          # defines a scalar entity, typechecks a createTypedSheets()/
          # EntityManager find() usage, and pins compile-time rejection guards
          # on internal symbols. It is typechecked only; nothing executes and
          # no Google credentials are required.
          node scripts/ci/run-consumer-typecheck.mjs --consumer-dir "$consumer_dir"

          # Both installed scenarios import ONLY the installed `hikoutei` root.
          cp scripts/ci/run-root-api-scenario.mjs "$consumer_dir/run-root-api-scenario.mjs"
          cp scripts/ci/run-public-api-surface.mjs "$consumer_dir/run-public-api-surface.mjs"
          cp scripts/ci/root-api-options.mjs "$consumer_dir/root-api-options.mjs"
          node "$consumer_dir/run-root-api-scenario.mjs" \
            --output="$RUNNER_TEMP/hikoutei-stable-root-api-smoke-result.json"
          node "$consumer_dir/run-public-api-surface.mjs" \
            --output="$RUNNER_TEMP/hikoutei-stable-public-api-surface-result.json"

      - name: Upload repository and installed-consumer reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hikoutei-stable-fake-reports
          path: |
            ${{ runner.temp }}/hikoutei-stable-fake-result.json
            ${{ runner.temp }}/hikoutei-stable-root-api-smoke-result.json
            ${{ runner.temp }}/hikoutei-stable-public-api-surface-result.json
          if-no-files-found: ignore

      - name: Upload stable package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: hikoutei-stable-package
          path: ${{ runner.temp }}/hikoutei-stable-package
          if-no-files-found: error

  publish:
    name: Publish stable package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: write is required for the GITHUB_TOKEN to create a
      # repository_dispatch event for the example verification workflows.
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # Publish runs without pnpm on purpose (it only publishes the
          # verified pre-built tarball). setup-node v5's package-manager-cache
          # defaults to true and probes pnpm-lock.yaml, failing the job with
          # "Unable to locate executable file: pnpm"; publish needs no cache.
          package-manager-cache: false

      - name: Download stable package
        uses: actions/download-artifact@v7
        with:
          name: hikoutei-stable-package
          path: ${{ runner.temp }}/hikoutei-stable-package

      - name: Set up pnpm
        # Needed by the ikisaki publish step below (build via pnpm).
        # Version is read from the packageManager field in package.json.
        uses: pnpm/action-setup@v4

      - name: Publish ikisaki package (idempotent)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish the ikisaki package." >&2
            exit 1
          fi
          # The hikoutei tarball depends on the exact @hikoutei/ikisaki version
          # declared in the workspace manifest, so that version must exist on
          # the registry before hikoutei is published. Publish at most once per
          # version; later releases skip the step.
          ikisaki_version="$(node -p "require('./packages/ikisaki/package.json').version")"
          if npm view "@hikoutei/ikisaki@${ikisaki_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@hikoutei/ikisaki@${ikisaki_version} already published; skipping."
          else
            # npm pack below is deliberate: it produces the publishable
            # tarball (registry act, unchanged until P8-DD). The INSTALL is
            # pnpm; the build goes through pnpm's workspace filtering.
            pnpm install --frozen-lockfile
            pnpm --filter @hikoutei/ikisaki run build
            (cd packages/ikisaki && npm publish --tag latest --access public)
          fi

      - name: Verify latest dist-tag monotonicity
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_version="${TAG_NAME#v}"
          current_version="$(node scripts/ci/read-npm-dist-tag.mjs --package=hikoutei --tag=latest)"
          CURRENT_CHANNEL_VERSION="$current_version" TARGET_VERSION="$expected_version" node --input-type=module <<'NODE'
          import { compareStableVersions } from "./scripts/ci/release-version.mjs";
          const current = process.env.CURRENT_CHANNEL_VERSION?.trim() ?? "";
          const target = process.env.TARGET_VERSION ?? "";
          if (current === "" || current === "null" || current === "undefined") process.exit(0);
          const result = compareStableVersions(current, target);
          if (result.status === "invalid" || result.comparison > 0) {
            throw new Error(`latest dist-tag would move backward: current=${current} target=${target}`);
          }
          console.log(`latest dist-tag current=${current} target=${target}`);
          NODE

      - name: Publish stable package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish the stable package." >&2
            exit 1
          fi
          if [[ "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "Release tag must be a numeric vX.Y.Z semver: $TAG_NAME" >&2
            exit 1
          fi
          package_dir="$RUNNER_TEMP/hikoutei-stable-package"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -name 'hikoutei-*.tgz' -type f -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "expected exactly one stable package, found ${#packages[@]}" >&2
            exit 1
          fi
          package_file="${packages[0]}"
          checksum_file="$package_dir/hikoutei-stable-package.sha256"
          if [[ ! -f "$checksum_file" ]]; then
            echo "missing stable checksum file $checksum_file" >&2
            exit 1
          fi
          # Assert the checksum line names the tarball we actually publish, not
          # merely any file that sha256sum --check happens to find in the dir.
          expected_name="$(basename "$package_file")"
          recorded_name="$(awk 'NR==1{n=$2; sub(/^\*/,"",n); print n}' "$checksum_file")"
          if [[ "$recorded_name" != "$expected_name" ]]; then
            echo "stable checksum names '$recorded_name' but tarball is '$expected_name'" >&2
            exit 1
          fi
          (cd "$package_dir" && sha256sum --check hikoutei-stable-package.sha256)
          tar -xOf "$package_file" package/package.json > "$RUNNER_TEMP/hikoutei-stable-package.json"
          node -e '
            const pkg = require(process.argv[1]);
            const expected = process.argv[2];
            const isStable = /^\d+\.\d+\.\d+$/.test(pkg.version);
            if (pkg.name !== "hikoutei" || !isStable || pkg.version !== expected) process.exit(1);
          ' "$RUNNER_TEMP/hikoutei-stable-package.json" "$expected_version"
          npm publish "$package_file" --tag latest --access public --provenance

      - name: Publish to GitHub Packages mirror
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_version="${TAG_NAME#v}"
          package_dir="$RUNNER_TEMP/hikoutei-stable-package"
          scoped_dir="$RUNNER_TEMP/hikoutei-stable-gh-packages"
          rm -rf "$scoped_dir"
          mkdir -p "$scoped_dir"
          # The GitHub Packages npm registry only hosts scoped packages, so the
          # verified tarball is re-packed under @ManddarinShop/hikoutei. The
          # npmjs release keeps the unscoped name; contents are identical.
          package_file="$(find "$package_dir" -maxdepth 1 -name 'hikoutei-*.tgz' -type f -print -quit)"
          test -n "$package_file"
          tar -xzf "$package_file" -C "$scoped_dir"
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const expected = process.argv[2];
            const pkg = JSON.parse(fs.readFileSync(dir + "/package/package.json", "utf8"));
            if (pkg.name !== "hikoutei" || pkg.version !== expected) process.exit(1);
            pkg.name = "@ManddarinShop/hikoutei";
            fs.writeFileSync(dir + "/package/package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$scoped_dir" "$expected_version"
          (cd "$scoped_dir" && tar -czf "$RUNNER_TEMP/hikoutei-stable-gh-packages.tgz" package)
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_PACKAGES_TOKEN" > .npmrc
          npm publish "$RUNNER_TEMP/hikoutei-stable-gh-packages.tgz" \
            --registry=https://npm.pkg.github.com \
            --tag latest --access public

      - name: Dispatch example verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          version="${version#develop-v}"
          # The repository_dispatch API requires client_payload as a JSON
          # object; -f would send it as a string and fail with HTTP 422, so
          # the whole request body is passed through stdin as JSON.
          body="{\"event_type\":\"examples-verify\",\"client_payload\":{\"version\":\"$version\"}}"
          if ! printf '%s' "$body" | gh api repos/${{ github.repository }}/dispatches \
            -X POST --input - >/dev/null; then
            echo "warning: failed to dispatch example verification for $version" >&2
          fi
