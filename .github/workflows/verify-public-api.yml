name: Public API surface verification

# Verifies the full public entity-lifecycle surface of an exact published
# hikoutei version (dist-tag or exact version) against an installed npm
# consumer, at 100-record scale. Runs automatically on the same
# `examples-verify` repository_dispatch the publish workflows emit (so every
# publish is verified) or manually via workflow_dispatch with a version input.
# The scenario lives in scripts/ci/run-public-api-surface.mjs and never
# contacts Google Sheets or needs credentials.
on:
  repository_dispatch:
    types: [examples-verify]
  workflow_dispatch:
    inputs:
      version:
        description: "hikoutei version to verify (npm dist-tag or exact version)"
        required: false
        default: latest

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ github.event.client_payload.version || github.event.inputs.version || 'latest' }}
        shell: bash
        run: |
          version="$VERSION_INPUT"
          if [[ ! "$version" =~ ^[0-9A-Za-z.\-]+$ ]]; then
            echo "invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install published hikoutei with MikroORM peers
        env:
          HIKOUTEI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          consumer_dir="$RUNNER_TEMP/hikoutei-public-api-consumer"
          mkdir -p "$consumer_dir"
          (
            cd "$consumer_dir"
            npm init -y >/dev/null
            # @mikro-orm/core and @mikro-orm/sql are optional peerDependencies
            # of hikoutei, so npm does not install them automatically; install
            # them explicitly at the pinned versions, as the CI consumer does.
            npm install --no-audit --no-fund --ignore-scripts \
              "hikoutei@${HIKOUTEI_VERSION}" \
              "@mikro-orm/core@7.1.7" \
              "@mikro-orm/sql@7.1.7"
          )

      - name: Run public API surface scenario
        run: |
          consumer_dir="$RUNNER_TEMP/hikoutei-public-api-consumer"
          cp scripts/ci/run-public-api-surface.mjs "$consumer_dir/run-public-api-surface.mjs"
          cp scripts/ci/root-api-options.mjs "$consumer_dir/root-api-options.mjs"
          node "$consumer_dir/run-public-api-surface.mjs" \
            --output="$RUNNER_TEMP/hikoutei-public-api-surface-result.json"

      - name: Upload scenario result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hikoutei-public-api-surface-result
          path: ${{ runner.temp }}/hikoutei-public-api-surface-result.json
          if-no-files-found: ignore
