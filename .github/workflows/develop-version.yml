name: Create develop prerelease release

# A develop merge advances the `X.Y.(Z+k)-dev` prerelease line (the patch
# marches forward from the stable line with a fixed bare `-dev` suffix, e.g.
# latest 0.10.0 → 0.10.1-dev, then 0.10.2-dev) and creates a non-production
# release tag `develop-vX.Y.Z-dev`. Legacy `develop-vX.Y.Z-dev.N` tags are
# rejected by the publish workflow; the two formats never mix. The tag publish
# workflow owns npm publication under the `dev` dist-tag; `latest` is reserved
# for the main/stable channel.
on:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'website/**'
      - 'README.md'

concurrency:
  group: release-develop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Version develop prerelease release
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore(release): bump develop version')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a workflow-triggering release token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN:-}" ]]; then
            echo "RELEASE_TOKEN secret is required so the generated tag can trigger develop-publish.yml." >&2
            exit 1
          fi

      - name: Check out develop
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up pnpm
        # Version is read from the packageManager field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the merge commit before release work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop
          remote_sha="$(git rev-parse origin/develop)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "develop advanced before release preparation: remote=$remote_sha event=$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Verify the current package
        run: |
          pnpm run typecheck
          pnpm run typecheck:test
          pnpm test
          pnpm run build

      - name: Calculate and apply the dev prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # The committed manifest may carry a `-dev.N` (legacy) or `-dev`
          # (current) prerelease during migration; normalize to its numeric
          # triple for the bootstrap fallback when the published `latest`
          # dist-tag is still absent.
          manifest_version="$(node -p "require('./package.json').version")"
          manifest_base="$(node scripts/ci/release-version.mjs \
            --normalize-base="$manifest_version")"
          # Never let the develop line trail the published npm `latest`
          # dist-tag. A stable release or a per-PR recovery publish
          # (hikoutei-tag-publish) can advance `latest` independently of the
          # develop line, which would otherwise make a develop release that
          # is numerically below the already-published latest fail its
          # monotonic channel check. The next prerelease marches the patch
          # forward from max(published latest, current dev) via the
          # unit-tested computeNextDevVersion(latest, currentDev) helper, so a
          # develop merge always moves its channel forward.
          # Read the published `latest` fail-closed: the helper exits 0 with
          # the version (found) or an empty value (tag/package missing) and
          # exits non-zero on any network/auth/malformed-output failure. A
          # registry failure must abort the release instead of silently
          # falling back to a base that could re-publish a stale dev version.
          if ! published_latest="$(node scripts/ci/read-npm-dist-tag.mjs \
            --package=hikoutei --tag=latest)"; then
            echo "Unable to read the npm 'latest' dist-tag; aborting instead of risking a stale prerelease." >&2
            exit 1
          fi
          effective_latest="$published_latest"
          if [[ -z "$effective_latest" ]]; then
            # First-publication bootstrap: no `latest` yet, so anchor the
            # patch march on the manifest's numeric triple.
            effective_latest="$manifest_base"
          fi
          # The dev channel advances via the patch march `X.Y.(Z+k)-dev`:
          # read the current `dev` dist-tag and compute
          # (max(L, D triple) patch + 1)-dev. Helpers live in
          # scripts/ci/semver-monotonic.mjs so the rules are unit-tested
          # instead of re-implemented inline.
          # Same fail-closed contract as the `latest` read above: `found`
          # yields the version, `missing` yields empty (first dev write), and
          # any registry failure aborts instead of computing from a stale value.
          if ! dev_current="$(node scripts/ci/read-npm-dist-tag.mjs \
            --package=hikoutei --tag=dev)"; then
            echo "Unable to read the npm 'dev' dist-tag; aborting instead of computing from a stale value." >&2
            exit 1
          fi
          next_version="$(node scripts/ci/semver-monotonic.mjs \
            --next-dev --latest="$effective_latest" --current-dev="$dev_current")"
          # Idempotency: a previous run may have committed the bump while
          # its publish never completed (a skipped/failed publish leaves the
          # manifest ahead of the published dev tag). The next run then
          # recomputes the same version and `npm version` dies with
          # "Version not changed", wedging every later release. If the
          # computed version does not move past the manifest, advance the
          # manifest one patch instead (0.10.2-dev -> 0.10.3-dev); the
          # skipped stillborn version is simply never published, which is
          # harmless on the dev channel. The comparison delegates to the
          # unit-tested helper (exit 0 = manifest at/ahead of computed).
          manifest_dev_version="$(node -p "require('./package.json').version")"
          if node scripts/ci/semver-monotonic.mjs --monotonic \
            --current="$next_version" --target="$manifest_dev_version" >/dev/null 2>&1; then
            if [[ ! "$manifest_dev_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]; then
              echo "Manifest version is not a plain X.Y.Z-dev prerelease; refusing to guess the next version." >&2
              exit 1
            fi
            next_version="$(node -e '
              const [triple] = process.argv[1].split("-dev");
              const [major, minor, patch] = triple.split(".").map(Number);
              console.log(`${major}.${minor}.${patch + 1}-dev`);
            ' "$manifest_dev_version")"
            echo "Manifest already at $manifest_dev_version; advancing to $next_version (stillborn version skipped)."
          fi
          npm version "$next_version" --no-git-tag-version
          # Pin the cli workspace dependency to the new root release version
          # so the package can be resolved by npm (which rejects workspace:*
          # protocol). The cli always lags the root by one release; updating
          # it here keeps the pin in lockstep (P8-D1). Manifests are
          # discovered by dependency edge, not path, so the pin follows
          # packages that move (e.g. cli under library/cloud).
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const next = process.argv[1];
            const out = execFileSync(process.execPath, ["scripts/ci/find-workspace-dir.mjs", "--with-dep=hikoutei"], { encoding: "utf8" });
            for (const rel of out.split("\n").map((s) => s.trim()).filter(Boolean)) {
              const pkg = JSON.parse(fs.readFileSync(rel, "utf8"));
              const table = pkg.dependencies?.hikoutei !== undefined ? pkg.dependencies : pkg.devDependencies;
              table["hikoutei"] = next;
              fs.writeFileSync(rel, JSON.stringify(pkg, null, 2) + "\n");
            }
          ' "$next_version"
          # Bump the @hikoutei/ikisaki kernel patch version only when its
          # source or manifest changed since the last develop release, and keep
          # every consumer pin in lockstep so no package references a kernel
          # version that lacks the merged changes. Consumers are discovered
          # by dependency edge: Step-1 style additions (contracts, sheets)
          # must follow the bump, and directory moves must not drop anyone.
          # A bump that updates only some pins leaves the rest resolving the
          # stale registry tarball (ETARGET when the pinned version was
          # never published).
          ikisaki_dir="$(node scripts/ci/find-workspace-dir.mjs --package=@hikoutei/ikisaki)"
          ikisaki_changed="false"
          last_tag="$(git describe --tags --match 'develop-v*' --abbrev=0 2>/dev/null || true)"
          if [[ -n "$last_tag" ]] && git diff --name-only "$last_tag"..HEAD -- "$ikisaki_dir/src" "$ikisaki_dir/package.json" | grep -q .; then
            ikisaki_changed="true"
          fi
          ikisaki_next_version=""
          if [[ "$ikisaki_changed" == "true" ]]; then
            ikisaki_base_version="$(node -p "require('./$ikisaki_dir/package.json').version")"
            ikisaki_next_version="$(node scripts/ci/release-version.mjs \
              --base-version="$ikisaki_base_version" \
              --bump=patch)"
            # Direct manifest edit, deliberately NOT `npm version -w`: the
            # npm command re-resolves the workspace tree internally and dies
            # ETARGET when consumer pins match neither the workspace
            # (mid-bump) nor the registry (an unpublished pin never
            # resolves). The edit is exact and both lockfiles are
            # regenerated below anyway, so the intermediate reify buys
            # nothing and can only fail.
            node -e '
              const fs = require("node:fs");
              const rel = `${process.argv[2]}/package.json`;
              const pkg = JSON.parse(fs.readFileSync(rel, "utf8"));
              pkg.version = process.argv[1];
              fs.writeFileSync(rel, JSON.stringify(pkg, null, 2) + "\n");
            ' "$ikisaki_next_version" "$ikisaki_dir"
            node -e '
              const { execFileSync } = require("node:child_process");
              const fs = require("node:fs");
              const next = process.argv[1];
              // Root pins the kernel too but lives outside packages/, so it
              // stays explicit while workspace consumers are discovered.
              const rels = ["./package.json", ...execFileSync(process.execPath, ["scripts/ci/find-workspace-dir.mjs", "--with-dep=@hikoutei/ikisaki"], { encoding: "utf8" }).split("\n").map((s) => s.trim()).filter(Boolean)];
              for (const rel of rels) {
                const pkg = JSON.parse(fs.readFileSync(rel, "utf8"));
                const table = pkg.dependencies?.["@hikoutei/ikisaki"] !== undefined ? pkg.dependencies : pkg.devDependencies;
                table["@hikoutei/ikisaki"] = next;
                fs.writeFileSync(rel, JSON.stringify(pkg, null, 2) + "\n");
              }
            ' "$ikisaki_next_version"
          fi
          # Regenerate lockfiles after all manifest changes (root, cli pin,
          # and optional ikisaki bump) are settled.
          npm install --package-lock-only --no-audit --no-fund --ignore-scripts
          # Dual-lockfile transition (P8-D1): package-lock.json is kept until
          # every consumer of it is flipped; pnpm-lock.yaml is the pnpm
          # source of truth and must move with the version pins so a
          # later `pnpm install --frozen-lockfile` still resolves the exact
          # pins to the workspace package (linkWorkspacePackages: true).
          pnpm install --lockfile-only
          node -e '
            const expected = process.argv[1];
            const pkg = require("./package.json");
            const lock = require("./package-lock.json");
            if (pkg.name !== "hikoutei" || pkg.version !== expected || lock.version !== expected || lock.packages[""].version !== expected) process.exit(1);
          ' "$next_version"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "ikisaki_changed=$ikisaki_changed" >> "$GITHUB_OUTPUT"
          echo "ikisaki_version=$ikisaki_next_version" >> "$GITHUB_OUTPUT"

      - name: Verify version bump scope
        shell: bash
        env:
          IKISAKI_CHANGED: ${{ steps.version.outputs.ikisaki_changed }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          # Expected scope is built from the same discovery the version step
          # uses, so directory moves cannot desync the allowlist from the
          # files the bump actually touches.
          root_pins="$(node scripts/ci/find-workspace-dir.mjs --with-dep=hikoutei)"
          expected="$(printf 'package-lock.json\npackage.json\npnpm-lock.yaml\n%s' "$root_pins" | sort -u)"
          if [[ "$IKISAKI_CHANGED" == "true" ]]; then
            ikisaki_manifest="$(node scripts/ci/find-workspace-dir.mjs --package=@hikoutei/ikisaki)/package.json"
            kernel_pins="$(node scripts/ci/find-workspace-dir.mjs --with-dep=@hikoutei/ikisaki)"
            expected="$(printf '%s\n%s\n%s\npackage.json' "$expected" "$ikisaki_manifest" "$kernel_pins" | sort -u)"
          fi
          if [[ "$changed" != "$expected" ]]; then
            printf 'unexpected version bump files:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Commit and tag the develop release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IKISAKI_CHANGED: ${{ steps.version.outputs.ikisaki_changed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json pnpm-lock.yaml
          node scripts/ci/find-workspace-dir.mjs --with-dep=hikoutei | xargs -r git add
          if [[ "$IKISAKI_CHANGED" == "true" ]]; then
            git add "$(node scripts/ci/find-workspace-dir.mjs --package=@hikoutei/ikisaki)/package.json"
            node scripts/ci/find-workspace-dir.mjs --with-dep=@hikoutei/ikisaki | xargs -r git add
          fi
          git commit -m "chore(release): bump develop version to $RELEASE_VERSION"
          git tag -a "develop-v$RELEASE_VERSION" \
            -m "chore(release): develop $RELEASE_VERSION"

      - name: Push the develop release commit and tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin develop
          remote_sha="$(git rev-parse origin/develop)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "develop advanced during release preparation: remote=$remote_sha event=$GITHUB_SHA" >&2
            exit 1
          fi
          git push --atomic origin HEAD:develop "refs/tags/develop-v$RELEASE_VERSION"
