name: Publish beta package

on:
  push:
    branches:
      - develop

concurrency:
  group: beta-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify beta package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck production code
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Run unit and contract tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package name and contents
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "hikoutei"
          npm pack --dry-run

      - name: Assign unique beta version
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./package.json').version")"
          base_version="${base_version%%-*}"
          IFS=. read -r major minor patch <<< "$base_version"
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
            echo "package version must be a numeric semver: $base_version" >&2
            exit 1
          fi
          beta_version="${major}.${minor}.${patch}-beta.b${RUN_ID}.${RUN_ATTEMPT}"
          npm version "$beta_version" --no-git-tag-version
          echo "Publishing hikoutei@$beta_version"

      - name: Pack beta package
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          package_path="$RUNNER_TEMP/$package_file"
          test -f "$package_path"
          tar -xOf "$package_path" package/package.json > "$RUNNER_TEMP/hikoutei-beta-package.json"
          node -e 'const p=require(process.argv[1]); if(p.name!=="hikoutei" || !p.version.includes("-beta.")) process.exit(1)' "$RUNNER_TEMP/hikoutei-beta-package.json"
          (cd "$RUNNER_TEMP" && sha256sum "$package_file" > hikoutei-beta-package.sha256)
          echo "Packed $package_path"

      - name: Run installed-package internal sync/gateway E2E (fake)
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/hikoutei-beta-consumer"
          mkdir -p "$consumer_dir"
          package_file="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'hikoutei-*.tgz' -type f -print -quit)"
          test -n "$package_file"

          (
            cd "$consumer_dir"
            npm init -y >/dev/null
            npm install --no-audit --no-fund --ignore-scripts \
              "$package_file" \
              "@mikro-orm/core@7.1.7" \
              "@mikro-orm/sql@7.1.7"
          )

          cp scripts/ci/run-api-scenario.mjs "$consumer_dir/run-api-scenario.mjs"
          node "$consumer_dir/run-api-scenario.mjs" \
            --backend=fake \
            --output="$RUNNER_TEMP/hikoutei-beta-fake-result.json" \
            --manifest="$RUNNER_TEMP/hikoutei-beta-fake-manifest.json"

      - name: Upload beta fake E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikoutei-beta-fake-sync-gateway-e2e
          path: ${{ runner.temp }}/hikoutei-beta-fake-result.json
          if-no-files-found: ignore

      - name: Upload beta package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hikoutei-beta-package
          path: |
            ${{ runner.temp }}/hikoutei-*.tgz
            ${{ runner.temp }}/hikoutei-beta-package.sha256
          if-no-files-found: error

  publish:
    name: Publish beta package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download beta package
        uses: actions/download-artifact@v4
        with:
          name: hikoutei-beta-package
          path: ${{ runner.temp }}/hikoutei-beta-package

      - name: Publish beta package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish the beta package." >&2
            exit 1
          fi
          package_dir="$RUNNER_TEMP/hikoutei-beta-package"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -name 'hikoutei-*.tgz' -type f -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "expected exactly one beta package, found ${#packages[@]}" >&2
            exit 1
          fi
          package_file="${packages[0]}"
          (cd "$package_dir" && sha256sum --check hikoutei-beta-package.sha256)
          tar -xOf "$package_file" package/package.json > "$RUNNER_TEMP/hikoutei-beta-package.json"
          node -e 'const p=require(process.argv[1]); if(p.name!=="hikoutei" || !p.version.includes("-beta.")) process.exit(1)' "$RUNNER_TEMP/hikoutei-beta-package.json"
          current_sha="$(git ls-remote origin refs/heads/develop | awk '{print $1}')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to publish stale develop commit $GITHUB_SHA; current develop is $current_sha." >&2
            exit 1
          fi
          npm publish "$package_file" --tag beta --access public --provenance
