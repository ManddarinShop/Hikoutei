name: Publish canonical codec package

# Publish with a tag such as canonical-codec-v0.1.0. The tag must match the
# workspace package version; Hikoutei releases verify that this exact version
# already exists before publishing a root package that depends on it.
on:
  push:
    tags:
      - 'canonical-codec-v[0-9]*'

concurrency:
  group: canonical-codec-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify canonical codec package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate tag matches package version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG_NAME" =~ ^canonical-codec-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "Codec release tag must be canonical-codec-vX.Y.Z: $TAG_NAME" >&2
            exit 1
          fi
          package_name="$(node -p "require('./packages/canonical-codec/package.json').name")"
          package_version="$(node -p "require('./packages/canonical-codec/package.json').version")"
          test "$package_name" = "@hikoutei/canonical-codec"
          test "$package_version" = "$expected_version"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck codec source and tests
        run: |
          npm run typecheck:codec
          npm run typecheck:test:codec

      - name: Run codec tests
        run: npm run test:codec

      - name: Build codec package
        run: npm run build:codec

      - name: Verify Node and Apps Script parity
        run: npx vitest run test/canonical-codec.test.ts

      - name: Verify package boundary and contents
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'node:|@mikro-orm|googleapis' packages/canonical-codec/src --include='*.ts'; then
            echo "codec source must not depend on platform or provider packages" >&2
            exit 1
          fi
          if grep -R -n 'from "..' packages/canonical-codec/src --include='*.ts'; then
            echo "codec source must not import parent repository modules" >&2
            exit 1
          fi
          npm pack --workspace @hikoutei/canonical-codec --dry-run

      - name: Pack codec package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/canonical-codec-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          package_file="$(npm pack --workspace @hikoutei/canonical-codec --silent --pack-destination "$package_dir")"
          package_path="$package_dir/$package_file"
          test -f "$package_path"
          tar -xOf "$package_path" package/package.json > "$RUNNER_TEMP/canonical-codec-package.json"
          node -e '
            const pkg = require(process.argv[1]);
            if (pkg.name !== "@hikoutei/canonical-codec" || !/^\d+\.\d+\.\d+$/.test(pkg.version)) process.exit(1);
          ' "$RUNNER_TEMP/canonical-codec-package.json"
          tar -tzf "$package_path" | grep -q '^package/dist/index.js$'
          tar -tzf "$package_path" | grep -q '^package/dist/index.d.ts$'
          tar -tzf "$package_path" | grep -q '^package/README.md$'
          tar -tzf "$package_path" | grep -q '^package/LICENSE$'
          if tar -tzf "$package_path" | grep -qE '^package/(src|test)/'; then
            echo "codec package contains source or tests" >&2
            exit 1
          fi
          (cd "$package_dir" && sha256sum "$package_file" > canonical-codec-package.sha256)

      - name: Upload codec package
        uses: actions/upload-artifact@v5
        with:
          name: canonical-codec-package
          path: ${{ runner.temp }}/canonical-codec-package
          if-no-files-found: error

  publish:
    name: Publish canonical codec package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download codec package
        uses: actions/download-artifact@v5
        with:
          name: canonical-codec-package
          path: ${{ runner.temp }}/canonical-codec-package

      - name: Publish codec package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish @hikoutei/canonical-codec." >&2
            exit 1
          fi
          if [[ "$TAG_NAME" =~ ^canonical-codec-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "Codec release tag must be canonical-codec-vX.Y.Z: $TAG_NAME" >&2
            exit 1
          fi
          package_dir="$RUNNER_TEMP/canonical-codec-package"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -name 'hikoutei-canonical-codec-*.tgz' -type f -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "expected exactly one codec package, found ${#packages[@]}" >&2
            exit 1
          fi
          package_file="${packages[0]}"
          checksum_file="$package_dir/canonical-codec-package.sha256"
          test -f "$checksum_file"
          expected_name="$(basename "$package_file")"
          recorded_name="$(awk 'NR==1{n=$2; sub(/^\*/,"",n); print n}' "$checksum_file")"
          test "$recorded_name" = "$expected_name"
          (cd "$package_dir" && sha256sum --check canonical-codec-package.sha256)
          tar -xOf "$package_file" package/package.json > "$RUNNER_TEMP/canonical-codec-package.json"
          node -e '
            const pkg = require(process.argv[1]);
            const expected = process.argv[2];
            if (pkg.name !== "@hikoutei/canonical-codec" || pkg.version !== expected) process.exit(1);
          ' "$RUNNER_TEMP/canonical-codec-package.json" "$expected_version"
          npm publish "$package_file" --access public --provenance
