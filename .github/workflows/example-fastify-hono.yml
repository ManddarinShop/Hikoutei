name: Example Fastify+Hono verification

# Runs the Fastify+Hono example against an exact published hikoutei version:
# dispatched automatically by the publish workflows (event type
# `examples-verify`) or manually via workflow_dispatch with a version input.
# The scenario itself lives in scripts/ci/examples/fastify-hono.mjs.
on:
  repository_dispatch:
    types: [examples-verify]
  workflow_dispatch:
    inputs:
      version:
        description: "hikoutei version to verify (npm dist-tag or exact version)"
        required: false
        default: latest

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ github.event.client_payload.version || github.event.inputs.version || 'latest' }}
        shell: bash
        run: |
          version="$VERSION_INPUT"
          if [[ ! "$version" =~ ^[0-9A-Za-z.\-]+$ ]]; then
            echo "invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install example dependencies with published hikoutei
        env:
          HIKOUTEI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd examples/fastify-hono
          # S8543: resolve the requested dist-tag/exact input to its exact
          # registry version first, then install that exact version.
          resolved="$(npm view "hikoutei@${HIKOUTEI_VERSION}" version --registry=https://registry.npmjs.org)"
          echo "verifying hikoutei@${HIKOUTEI_VERSION} -> ${resolved}"
          npm install --no-audit --no-fund --ignore-scripts "hikoutei@${resolved}"

      - name: Run Fastify+Hono scenario
        run: node scripts/ci/examples/fastify-hono.mjs --dir examples/fastify-hono --output "$RUNNER_TEMP/result.json"

      - name: Upload scenario result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: example-fastify-hono-result
          path: ${{ runner.temp }}/result.json
          if-no-files-found: ignore
