# SonarCloud analysis configuration (CI scanner only; Automatic Analysis is
# disabled on sonarcloud.io to avoid double analysis).
#
# ADJUST on first setup: sonar.organization is the SonarCloud ORGANIZATION KEY
# (shown on sonarcloud.io, lowercase) created together with the project; it is
# not the GitHub org name. CI supplies the token via the SONAR_TOKEN secret.
sonar.organization=manddarinshop
sonar.projectKey=ManddarinShop_Hikoutei
sonar.projectName=Hikoutei

# Runtime sources of the root package and every workspace package; tests are
# analyzed as test code, not production source.
sonar.sources=src,packages
sonar.tests=test,packages/protocol/ikisaki/test
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/dist/**,**/coverage/**,**/node_modules/**,**/*.d.ts,**/*.d.mts

# Coverage: lcov emitted by `vitest run --coverage` (see package.json
# test:coverage). Both language keys are set because SonarCloud routes TS
# analysis through the JS/TS language family.
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8